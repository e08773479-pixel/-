<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدعم الفني والتقني - Quantum Physics Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: #030005;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .quantum-bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(255, 0, 119, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(0, 242, 254, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 204, 0, 0.1) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        .physics-floating-formula {
            position: absolute;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            opacity: 0.18;
            animation: quantumFloat 20s infinite linear;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes quantumFloat {
            0% { transform: translateY(115vh) translateX(-50px) rotate(0deg) scale(0.9); }
            50% { transform: translateY(50vh) translateX(50px) rotate(180deg) scale(1.1); }
            100% { transform: translateY(-150px) translateX(-30px) rotate(360deg) scale(0.9); }
        }

        .elite-glow-badge {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, rgba(255, 0, 119, 0.2), rgba(0, 242, 254, 0.2), rgba(255, 204, 0, 0.2));
            border: 2px solid rgba(0, 242, 254, 0.6);
            border-radius: 40px;
            padding: 10px 30px;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #00f2fe;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.4), inset 0 0 15px rgba(255, 0, 119, 0.3);
            z-index: 20;
            text-align: center;
        }

        .platform-quantum-card {
            position: relative;
            z-index: 10;
            background: rgba(10, 5, 18, 0.92);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 3px solid transparent;
            background-image: linear-gradient(rgba(10, 5, 18, 0.95), rgba(10, 5, 18, 0.95)), 
                              linear-gradient(135deg, #ff0077, #00f2fe, #ffcc00);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            border-radius: 50px;
            box-shadow: 0 70px 140px rgba(0, 0, 0, 0.95), 
                        0 0 60px rgba(255, 0, 119, 0.3), 
                        0 0 60px rgba(0, 242, 254, 0.3);
            width: 100%;
            max-width: 650px;
            padding: 45px 35px;
            text-align: center;
            margin: 90px 20px 30px 20px;
        }

        /* تعديل حجم الإطار والصورة ليكون بحجم كبير وواضح (بالمقاس المطلوب 60 وكبير) */
        .developer-box-elite {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #ff0077;
            box-shadow: 0 0 45px rgba(255, 0, 119, 0.7), 0 0 25px rgba(0, 242, 254, 0.5);
            margin: 0 auto 20px auto;
            background: #020617;
            position: relative;
        }
        
        .developer-box-elite img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%;
            display: block;
        }

        /* تنسيق النصوص بالترتيب تحت الصورة تماماً بشكل منسق وجذاب */
        .developer-info-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        .eng-title-elite {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff0077, #ffcc00, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .dev-role-subtitle {
            font-size: 17px;
            color: #00f2fe;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
        }

        .dev-phone-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 19px;
            color: #ffcc00;
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* زر التواصل والتشات السريع عبر الواتساب */
        .whatsapp-chat-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            border: none;
            border-radius: 20px;
            color: #fff;
            font-size: 19px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 15px 40px rgba(37, 211, 102, 0.4);
            margin-bottom: 25px;
        }

        .whatsapp-chat-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 50px rgba(37, 211, 102, 0.7), 0 0 30px rgba(0, 242, 254, 0.5);
        }

        .whatsapp-chat-btn span.icon {
            font-size: 26px;
        }

        .back-dashboard-link {
            display: inline-block;
            color: #94a3b8;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            transition: color 0.3s;
        }
        .back-dashboard-link:hover {
            color: #00f2fe;
        }
    </style>
</head>
<body>

    <div class="elite-glow-badge">⚡ 👑 ⚡ أنت الآن في المكان الصح ⚡ 👑 ⚡</div>

    <div class="quantum-bg-grid">
        <div class="physics-floating-formula" style="left: 6%; font-size: 45px; color: #ff0077; animation-duration: 16s;">E = mc²</div>
        <div class="physics-floating-formula" style="left: 25%; font-size: 50px; color: #ffcc00; animation-duration: 22s;">F = BIL sin($\theta$)</div>
        <div class="physics-floating-formula" style="left: 50%; font-size: 44px; color: #00f2fe; animation-duration: 18s;">V = I × R</div>
        <div class="physics-floating-formula" style="left: 75%; font-size: 48px; color: #ff0077; animation-duration: 24s;">$\oint B \cdot dl$</div>
    </div>

    <div class="platform-quantum-card">
        
        <!-- إطار الصورة بحجم كبير ومرتب -->
        <div class="developer-box-elite">
            <img src="56.jpg" alt="Youssef Ashraf">
        </div>

        <!-- النصوص مرتبة تحت الصورة تماماً بالتدرج المطلوب -->
        <div class="developer-info-wrapper">
            <div class="eng-title-elite">Youssef Ashraf</div>
            <div class="dev-role-subtitle">مبرمج المنصة 🛠️</div>
            <div class="dev-phone-display" id="displayDevPhone">📞 01102273068</div>
        </div>

        <!-- زر التشات المباشر عبر الواتساب -->
        <a id="whatsappDirectLink" href="https://api.whatsapp.com/send?phone=201102273068&text=سلام عليكم يا بشمهندس يوسف، عندي مشكلة أو استفسار في المنصة:" target="_blank" class="whatsapp-chat-btn">
            <span class="icon">💬</span>
            <span>تحدث معي مباشرة عبر الواتساب</span>
        </a>

        <a href="platform.html" class="back-dashboard-link">← العودة إلى لوحة التحكم الرئيسية</a>
    </div>

    <script>
        const developerPhone = "201102273068";
        const displayPhoneText = "01102273068";

        document.getElementById('displayDevPhone').innerText = `📞 ${displayPhoneText}`;
        document.getElementById('whatsappDirectLink').href = `https://api.whatsapp.com/send?phone=${developerPhone}&text=${encodeURIComponent('سلام عليكم يا بشمهندس يوسف، عندي مشكلة أو استفسار في المنصة:')}`;
    </script>

</body>
</html>
