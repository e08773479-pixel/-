<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مركز الدعم الفني | Quantum Physics Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    <style>
        body { background: #030005; color: #fff; font-family: 'Cairo', sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        
        /* الهيدر الخاص بك */
        #header { padding: 20px; text-align: center; border-bottom: 2px solid #00f2fe; background: #0a0512; }
        #dev-img { width: 120px; height: 120px; border-radius: 50%; border: 4px solid #ff0077; object-fit: cover; }
        
        /* منطقة الشات */
        #chat-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 18px; border-radius: 15px; max-width: 85%; font-size: 16px; }
        .admin-msg { background: #00f2fe; color: #030005; align-self: flex-start; font-weight: bold; }
        .student-msg { background: #202c33; color: #fff; align-self: flex-end; }
        
        /* منطقة الكتابة */
        #input-zone { padding: 20px; display: flex; gap: 10px; background: #0a0512; border-top: 1px solid #333; }
        input { flex: 1; padding: 15px; border-radius: 12px; border: none; background: #1a1025; color: #fff; }
        button { padding: 0 25px; background: #00f2fe; color: #030005; border: none; border-radius: 12px; font-weight: 900; cursor: pointer; }
    </style>
</head>
<body>

    <div id="header">
        <img src="56.jpg" id="dev-img" alt="Youssef Ashraf">
        <h2>يوسف أشرف - الدعم الفني</h2>
        <a href="dashboard.html" style="color:#ff0077; font-size: 14px; text-decoration:none;">العودة للرئيسية</a>
    </div>

    <div id="chat-area"></div>

    <div id="input-zone">
        <input type="text" id="userMsg" placeholder="اكتب استفسارك هنا...">
        <button onclick="sendSupportMsg()">إرسال</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onChildAdded, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // إعدادات Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyDPOmjs_GVMhx9qlEURlI90Gb1BDR9hiz8",
          databaseURL: "https://quantumchat-30a44-default-rtdb.firebaseio.com"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const userId = localStorage.getItem('userId') || 'guest_' + Date.now();
        const chatArea = document.getElementById('chat-area');

        // استقبال رسائل الأدمن (يوسف)
        onChildAdded(ref(db, `chats/${userId}`), (snapshot) => {
            const data = snapshot.val();
            const div = document.createElement('div');
            div.className = `msg ${data.sender === 'admin' ? 'admin-msg' : 'student-msg'}`;
            div.innerText = data.message;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        });

        // إرسال رسالة من الطالب
        window.sendSupportMsg = () => {
            const input = document.getElementById('userMsg');
            if(!input.value.trim()) return;
            
            push(ref(db, `chats/${userId}`), {
                sender: 'student',
                message: input.value,
                timestamp: Date.now()
            });
            input.value = '';
        };
    </script>
</body>
</html>
