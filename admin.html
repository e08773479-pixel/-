<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Elite | Admin Control Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2fe; --secondary: #ff0077; --bg: #030005; --card: #0a0512; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg); color: #fff; display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar { width: 320px; background: var(--card); border-left: 2px solid #333; padding: 20px; display: flex; flex-direction: column; overflow-y: auto; }
        .user-card { background: #1a1025; padding: 15px; border-radius: 15px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; gap: 15px; border: 1px solid #333; transition: 0.3s; }
        .user-card:hover { border-color: var(--primary); transform: scale(1.02); }
        
        #main-chat { flex: 1; display: flex; flex-direction: column; padding: 20px; background: radial-gradient(circle at bottom right, #1a1025, #030005); }
        .chat-header { border-bottom: 2px solid #333; padding-bottom: 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        
        .msg-bubble { padding: 10px 15px; border-radius: 10px; max-width: 60%; word-break: break-word; }
        .msg-admin { background: #00f2fe; color: #030005; align-self: flex-start; font-weight: bold; }
        .msg-student { background: #202c33; color: #fff; align-self: flex-end; }

        .input-area { display: flex; gap: 10px; padding-top: 20px; }
        
        input, textarea { width: 100%; padding: 15px; border-radius: 12px; background: #1a1025; border: 1px solid #444; color: #fff; font-size: 16px; }
        input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 15px rgba(0,242,254,0.4); }
        
        button { padding: 15px 30px; background: linear-gradient(135deg, var(--primary), #00a884); border: none; border-radius: 12px; font-weight: 900; cursor: pointer; transition: 0.3s; color: #030005; white-space: nowrap; }
        button:hover { filter: brightness(1.2); }
    </style>
</head>
<body>

    <aside id="sidebar">
        <h2 style="color:var(--primary); margin-bottom: 20px;">🛡️ لوحة التحكم</h2>
        <div id="users-list">
            <p style="color:#888; text-align:center; padding:20px;">جاري تحميل الطلاب...</p>
        </div>
    </aside>

    <main id="main-chat">
        <div class="chat-header">
            <h2 id="current-name">اختر طالباً للمحادثة</h2>
            <button onclick="window.broadcastMsg()" style="background: var(--secondary); color:#fff;">📢 إرسال إشعار للكل</button>
        </div>
        <div id="chat-messages">
            <p style="color:#666; text-align:center; margin:auto;">اختر طالباً من القائمة الجانبية لبدء المحادثة الفورية</p>
        </div>
        <div class="input-area">
            <input type="text" id="msg-input" placeholder="اكتب رسالتك الاحترافية..." onkeypress="if(event.key === 'Enter') window.sendMsg()">
            <button onclick="window.sendMsg()">إرسال ⚡</button>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        
        const firebaseConfig = {
          apiKey: "AIzaSyDPOmjs_GVMhx9qlEURlI90Gb1BDR9hiz8",
          authDomain: "quantumchat-30a44.firebaseapp.com",
          databaseURL: "https://quantumchat-30a44-default-rtdb.firebaseio.com",
          projectId: "quantumchat-30a44",
          storageBucket: "quantumchat-30a44.firebasestorage.app",
          messagingSenderId: "898270556820",
          appId: "1:898270556820:web:0dc8cbf8bd510daab37a81",
          measurementId: "G-S8BF8Z6RT2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let activeUserId = null;

        // جلب قائمة الطلاب المسجلين وحالة الاتصال بدقة (متصل / مغلق)
        onValue(ref(db, 'quantum_users'), (snapshot) => {
            const list = document.getElementById('users-list');
            list.innerHTML = '';
            
            if (!snapshot.exists()) {
                list.innerHTML = '<p style="color:#888; text-align:center; padding:20px;">لا يوجد طلاب مسجلين حتى الآن</p>';
                return;
            }

            snapshot.forEach(child => {
                const user = child.val();
                const userId = child.key;
                
                // تحديد حالة الاتصال
                const isOnline = user.status === "online";
                const statusColor = isOnline ? "#00ff80" : "#ff4d4d";
                const statusText = isOnline ? "متصل الآن 🟢" : "مغلق 🔴";

                list.innerHTML += `
                    <div class="user-card" onclick="window.loadChat('${userId}', '${user.name}')">
                        <img src="${user.userImage || '55.jpg'}" style="width:45px; height:45px; border-radius:50%; border:2px solid ${statusColor}; object-fit: cover;">
                        <div style="flex:1; overflow:hidden;">
                            <b style="color:#fff; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${user.name}</b>
                            <small style="color:${statusColor}; font-weight:bold;">${statusText}</small>
                        </div>
                    </div>`;
            });
        });

        // فتح محادثة الطالب المحدد
        window.loadChat = (userId, userName) => {
            activeUserId = userId;
            document.getElementById('current-name').innerText = `المحادثة مع: ${userName}`;
            
            const msgArea = document.getElementById('chat-messages');
            onValue(ref(db, `chats/${userId}`), (snapshot) => {
                msgArea.innerHTML = '';
                if (!snapshot.exists()) {
                    msgArea.innerHTML = '<p style="color:#666; text-align:center; margin:auto;">لا توجد رسائل سابقة مع هذا الطالب</p>';
                    return;
                }
                snapshot.forEach(child => {
                    const msg = child.val();
                    const bubbleClass = msg.sender === 'admin' ? 'msg-admin' : 'msg-student';
                    msgArea.innerHTML += `<div class="msg-bubble ${bubbleClass}">${msg.message}</div>`;
                });
                msgArea.scrollTop = msgArea.scrollHeight;
            });
        };

        // إرسال رسالة خاصة للطالب المحدد
        window.sendMsg = () => {
            if (!activeUserId) {
                alert('الرجاء اختيار طالب أولاً من القائمة الجانبية!');
                return;
            }
            const inputField = document.getElementById('msg-input');
            const text = inputField.value.trim();
            if (!text) return;

            push(ref(db, `chats/${activeUserId}`), {
                sender: 'admin',
                message: text,
                timestamp: Date.now()
            });

            inputField.value = '';
        };

        // إرسال إشعار عام للجميع
        window.broadcastMsg = () => {
            const text = prompt('اكتب نص الإشعار العام الذي سيظهر لجميع الطلاب لحظياً:');
            if (!text || text.trim() === "") return;

            push(ref(db, 'global_notifications'), {
                message: text,
                timestamp: Date.now()
            }).then(() => {
                alert('🚀 تم إرسال الإشعار لجميع الطلاب بنجاح!');
            });
        };
    </script>
</body>
</html>
