<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الإدارية - Quantum Physics</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #030005; color: #fff; padding: 20px; }
        
        .admin-panel { max-width: 800px; margin: 50px auto; background: #111b21; padding: 30px; border-radius: 25px; border: 2px solid #00f2fe; box-shadow: 0 0 30px rgba(0,242,254,0.2); }
        h1 { color: #00f2fe; text-align: center; margin-bottom: 25px; }
        
        .control-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 10px; font-weight: bold; }
        textarea { width: 100%; padding: 15px; border-radius: 12px; background: #202c33; border: 1px solid #3b1f4e; color: #fff; font-size: 16px; }
        
        button { width: 100%; padding: 15px; background: linear-gradient(135deg, #00f2fe, #00a884); border: none; border-radius: 12px; color: #030005; font-weight: 900; font-size: 18px; cursor: pointer; transition: 0.3s; }
        button:hover { transform: scale(1.02); opacity: 0.9; }
        
        #accessDenied { display: none; text-align: center; color: #ff0055; font-size: 24px; margin-top: 100px; }
    </style>
</head>
<body>

    <div id="adminContent" class="admin-panel" style="display:none;">
        <h1>👑 لوحة تحكم الأدمن</h1>
        <div class="control-group">
            <label>إرسال إشعار للجميع:</label>
            <textarea id="notifInput" rows="3" placeholder="اكتب نص الإشعار هنا..."></textarea>
        </div>
        <button onclick="sendNotification()">إرسال الإشعار الآن 🚀</button>
    </div>

    <div id="accessDenied">
        ⚠️ عذراً، لا تملك صلاحية الوصول لهذه الصفحة!
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDPOmjs_GVMhx9qlEURlI90Gb1BDR9hiz8",
          authDomain: "quantumchat-30a44.firebaseapp.com",
          databaseURL: "https://quantumchat-30a44-default-rtdb.firebaseio.com",
          projectId: "quantumchat-30a44",
          storageBucket: "quantumchat-30a44.firebasestorage.app",
          messagingSenderId: "898270556820",
          appId: "1:898270556820:web:0dc8cbf8bd510daab37a81",
          measurementId: "G-S8BF8Z6RT2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // التحقق من صلاحية الأدمن فور فتح الصفحة
        window.onload = () => {
            const userData = JSON.parse(localStorage.getItem('activeStudentData') || '{}');
            if (userData.isAdmin === true) {
                document.getElementById('adminContent').style.display = 'block';
            } else {
                document.getElementById('accessDenied').style.display = 'block';
            }
        };

        // دالة الإرسال
        window.sendNotification = () => {
            const text = document.getElementById('notifInput').value;
            if(!text) return alert('اكتب نصاً أولاً!');
            
            push(ref(db, 'global_notifications'), {
                message: text,
                timestamp: Date.now()
            }).then(() => {
                alert('✅ تم إرسال الإشعار بنجاح!');
                document.getElementById('notifInput').value = '';
            });
        };
    </script>
</body>
</html>
