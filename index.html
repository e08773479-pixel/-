<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eng. Mohamed Salah - Quantum Physics Elite Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        
        /* تثبيت تام للشاشة ومنع أي سكرول أو حركة خارجية */
        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            background: #030005;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .quantum-bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(255, 0, 119, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(0, 242, 254, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 204, 0, 0.1) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        .physics-floating-formula {
            position: absolute;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            opacity: 0.18;
            animation: quantumFloat 20s infinite linear;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes quantumFloat {
            0% { transform: translateY(115vh) translateX(-50px) rotate(0deg) scale(0.9); }
            50% { transform: translateY(50vh) translateX(50px) rotate(180deg) scale(1.1); }
            100% { transform: translateY(-150px) translateX(-30px) rotate(360deg) scale(0.9); }
        }

        .elite-glow-badge {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, rgba(255, 0, 119, 0.2), rgba(0, 242, 254, 0.2), rgba(255, 204, 0, 0.2));
            border: 2px solid rgba(0, 242, 254, 0.6);
            border-radius: 40px;
            padding: 8px 25px;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #00f2fe;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.4), inset 0 0 15px rgba(255, 0, 119, 0.3);
            z-index: 20;
        }

        .platform-quantum-card {
            position: relative;
            z-index: 10;
            background: rgba(10, 5, 18, 0.92);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 3px solid transparent;
            background-image: linear-gradient(rgba(10, 5, 18, 0.95), rgba(10, 5, 18, 0.95)), 
                              linear-gradient(135deg, #ff0077, #00f2fe, #ffcc00);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            border-radius: 40px;
            box-shadow: 0 70px 140px rgba(0, 0, 0, 0.95), 
                        0 0 60px rgba(255, 0, 119, 0.3), 
                        0 0 60px rgba(0, 242, 254, 0.3);
            width: 90%;
            max-width: 650px;
            max-height: 85vh; 
            overflow-y: auto;  
            padding: 40px 35px;
            text-align: center;
            margin-top: 30px;
        }

        .teacher-box-elite {
            width: 100%;
            height: 250px;
            border-radius: 25px;
            overflow: hidden;
            border: 4px solid #ff0077;
            box-shadow: 0 25px 60px rgba(255, 0, 119, 0.6), 0 0 30px rgba(0, 242, 254, 0.4);
            margin-bottom: 20px;
            background: #020617;
            position: relative;
        }
        
        /* التعديل لضمان ظهور الصورة كاملة بوضوح ومتناسقة */
        .teacher-box-elite img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center center;
            display: block;
            background: #020617;
        }

        .eng-title-elite {
            font-family: 'Orbitron', sans-serif;
            font-size: 34px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff0077, #ffcc00, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .platform-desc {
            font-size: 15px;
            color: #cbd5e1;
            margin-bottom: 20px;
            font-weight: 700;
            line-height: 1.6;
        }

        .success-matrix-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .matrix-chip {
            background: rgba(255, 204, 0, 0.1);
            border: 1px solid rgba(255, 204, 0, 0.5);
            color: #ffcc00;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 900;
        }
        .matrix-chip.cyan {
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.5);
            color: #00f2fe;
        }
        .matrix-chip.magenta {
            background: rgba(255, 0, 119, 0.1);
            border: 1px solid rgba(255, 0, 119, 0.5);
            color: #ff0077;
        }

        .input-group-quantum {
            margin-bottom: 20px;
            text-align: right;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: #f1f5f9;
            font-weight: 700;
        }
        input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(20, 10, 35, 0.9);
            border: 2px solid #3b1f4e;
            border-radius: 15px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        input:focus {
            border-color: #00f2fe;
            outline: none;
            background: rgba(8, 2, 15, 0.99);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.6);
        }

        .alert-message-box {
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: 700;
            display: none;
            text-align: center;
            animation: fadeIn 0.4s ease;
        }
        .alert-message-box.error {
            background: rgba(255, 0, 85, 0.15);
            border: 2px solid #ff0055;
            color: #ff4d88;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.3);
        }
        .alert-message-box.success {
            background: rgba(0, 255, 128, 0.15);
            border: 2px solid #00ff80;
            color: #4dff9e;
            box-shadow: 0 0 20px rgba(0, 255, 128, 0.3);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .submit-btn-quantum {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff0077, #ffcc00);
            border: none;
            border-radius: 15px;
            color: #030005;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 5px;
            box-shadow: 0 15px 40px rgba(255, 0, 119, 0.5);
            letter-spacing: 1px;
        }
        .submit-btn-quantum:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 50px rgba(255, 204, 0, 0.8), 0 0 30px rgba(0, 242, 254, 0.6);
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }
        .file-custom-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: rgba(20, 10, 35, 0.9);
            border: 2px dashed #00f2fe;
            border-radius: 15px;
            color: #00f2fe;
            text-align: center;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .file-custom-btn:hover {
            background: rgba(0, 242, 254, 0.1);
        }
    </style>
</head>
<body>

    <div class="elite-glow-badge">⚡👑 المنصة الأقوى في بركه السبع  للفيزياء المتقدمة 👑⚡</div>

    <div class="quantum-bg-grid">
        <div class="physics-floating-formula" style="left: 6%; font-size: 45px; color: #ff0077; animation-duration: 16s;">E = mc²</div>
        <div class="physics-floating-formula" style="left: 25%; font-size: 50px; color: #ffcc00; animation-duration: 22s;">F = BIL sin($\theta$)</div>
        <div class="physics-floating-formula" style="left: 50%; font-size: 44px; color: #00f2fe; animation-duration: 18s;">V = I × R</div>
        <div class="physics-floating-formula" style="left: 75%; font-size: 48px; color: #ff0077; animation-duration: 24s;">$\oint B \cdot dl$</div>
    </div>

    <div class="platform-quantum-card">
        
        <div class="teacher-box-elite">
            <img src="55.jpg" alt="Eng. Mohamed Salah">
        </div>

        <div class="eng-title-elite">Eng. Mohamed Salah</div>
        <p id="platformDesc" class="platform-desc">حيث تتلاقى دقة الفيزياء الكمية مع قوة الشرح المطلق للثانوية العامة - استعد للتوهج الكامل.</p>

        <div class="success-matrix-bar">
            <span class="matrix-chip">🏆 صناعة الأوائل</span>
            <span class="matrix-chip cyan">🚀 تفوق بلا حدود</span>
            <span class="matrix-chip magenta">💡 الفيزياء بمتعة</span>
        </div>

        <div id="formAlertBox" class="alert-message-box"></div>

        <form id="studentRegistrationForm" onsubmit="handlePlatformAuth(event)">
            
            <div id="dynamicFormFields">
                </div>

            <button type="submit" class="submit-btn-quantum" id="actionBtn">دخول المنصة وبدء المحاضرة الكبرى</button>
        </form>
    </div>

    <script src="codes.js"></script>

    <script>
        function sanitizeInput(input) {
            if (!input) return '';
            const element = document.createElement('div');
            element.innerText = input;
            return element.innerHTML;
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('formAlertBox');
            alertBox.innerText = message;
            alertBox.className = `alert-message-box ${type}`;
            alertBox.style.display = 'block';
            alertBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function getBase64(file, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function () { callback(reader.result); };
            reader.onerror = function (error) { console.log('Error: ', error); };
        }

        window.onload = function() {
            const isFirstVerified = localStorage.getItem('isFirstVerified') === 'true';
            const isAccountCreated = localStorage.getItem('isAccountCreated') === 'true';
            const fieldsContainer = document.getElementById('dynamicFormFields');
            const descEl = document.getElementById('platformDesc');
            const btnEl = document.getElementById('actionBtn');

            if (!isFirstVerified) {
                descEl.innerText = "أدخل بياناتك الأساسية وكود المنصة لإرسالها وتفعيل حسابك عبر الواتساب للمستر لأول مرة فقط.";
                btnEl.innerText = "تفعيل وإرسال للمستر عبر الواتساب 📱";
                fieldsContainer.innerHTML = `
                    <div class="input-group-quantum">
                        <label for="studentName">اسم الطالب الثلاثي:</label>
                        <input type="text" id="studentName" required placeholder="أدخل اسمك الكامل بوضوح">
                    </div>
                    <div class="input-group-quantum">
                        <label for="studentPhone">رقم تليفون الطالب:</label>
                        <input type="tel" id="studentPhone" required placeholder="01xxxxxxxx0">
                    </div>
                    <div class="input-group-quantum">
                        <label for="parentPhone">رقم تليفون ولي الأمر:</label>
                        <input type="tel" id="parentPhone" required placeholder="01xxxxxxxx0">
                    </div>
                    <div class="input-group-quantum">
                        <label for="platformCode">كود المنصة الخاص بك:</label>
                        <input type="text" id="platformCode" required placeholder="أدخل كود الاشتراك السري">
                    </div>
                `;
            } else if (!isAccountCreated) {
                const tempName = JSON.parse(localStorage.getItem('activeStudentData') || '{}').name || '';
                descEl.innerText = "تم استقبال تفعيلك بنجاح! الآن أنشئ حسابك الدائم (كلمة السر وصورتك الشخصية).";
                btnEl.innerText = "إنشاء الحساب الدائم والدخول 🚀";
                fieldsContainer.innerHTML = `
                    <div class="input-group-quantum">
                        <label for="savedUsername">اسم المستخدم (ثابت):</label>
                        <input type="text" id="savedUsername" value="${tempName}" readonly style="background: rgba(10,5,18,0.5); color: #00f2fe; cursor: not-allowed;">
                    </div>
                    <div class="input-group-quantum">
                        <label for="newPassword">أنشئ كلمة السر:</label>
                        <input type="password" id="newPassword" required placeholder="كلمة السر الخاصة بك لدخول لاحق">
                    </div>
                    <div class="input-group-quantum">
                        <label for="confirmPassword">تأكيد كلمة السر:</label>
                        <input type="password" id="confirmPassword" required placeholder="أعد كتابة كلمة السر">
                    </div>
                    <div class="input-group-quantum">
                        <label>اختر صورتك الشخصية:</label>
                        <div class="file-input-wrapper">
                            <div class="file-custom-btn" id="fileLabelText">📷 اضغط لاختيار صورتك الشخصية</div>
                            <input type="file" id="userImageFile" accept="image/*" onchange="updateFileName(this)">
                        </div>
                    </div>
                `;
            } else {
                const savedData = JSON.parse(localStorage.getItem('activeStudentData') || '{}');
                descEl.innerText = "مرحباً بك مجدداً يا بطل. أدخل كلمة السر الخاصة بك للدخول للمنصة.";
                btnEl.innerText = "تسجيل الدخول للمنصة ⚡";
                fieldsContainer.innerHTML = `
                    <div class="input-group-quantum">
                        <label>اسم المستخدم:</label>
                        <input type="text" value="${savedData.name || ''}" readonly style="background: rgba(10,5,18,0.5); color: #00f2fe; cursor: not-allowed;">
                    </div>
                    <div class="input-group-quantum">
                        <label for="loginPassword">كلمة السر:</label>
                        <input type="password" id="loginPassword" required placeholder="أدخل كلمة السر الخاصة بك">
                    </div>
                `;
            }
        };

        function updateFileName(input) {
            if (input.files && input.files[0]) {
                document.getElementById('fileLabelText').innerText = "✅ تم اختيار الصورة: " + input.files[0].name;
            }
        }

        function handlePlatformAuth(event) {
            event.preventDefault();

            const isFirstVerified = localStorage.getItem('isFirstVerified') === 'true';
            const isAccountCreated = localStorage.getItem('isAccountCreated') === 'true';
            const teacherWhatsAppNumber = "201102273068"; 

            if (!isFirstVerified) {
                const rawName = document.getElementById('studentName').value;
                const rawStudentPhone = document.getElementById('studentPhone').value;
                const rawParentPhone = document.getElementById('parentPhone').value;
                const rawCode = document.getElementById('platformCode').value.trim();

                if (typeof validCodes === 'undefined') {
                    showAlert('⚠️ خطأ في ملف الأكواد الخارجي (codes.js). تأكد من وجوده.', 'error');
                    return;
                }

                if (!validCodes.includes(rawCode)) {
                    showAlert('❌ عذراً يا بطل، كود المنصة غير صحيح أو غير مفعل.', 'error');
                    return;
                }

                const studentInfo = {
                    name: sanitizeInput(rawName),
                    studentPhone: sanitizeInput(rawStudentPhone),
                    parentPhone: sanitizeInput(rawParentPhone),
                    code: sanitizeInput(rawCode),
                    timestamp: new Date().toLocaleString()
                };

                localStorage.setItem('activeStudentData', JSON.stringify(studentInfo));

                const message = `✨ طالب جديد يطلب التفعيل بكود معتمد:\n\n` +
                                `👤 الاسم: ${studentInfo.name}\n` +
                                `📱 هاتف الطالب: ${studentInfo.studentPhone}\n` +
                                `📞 هاتف ولي الأمر: ${studentInfo.parentPhone}\n` +
                                `🔑 الكود: ${studentInfo.code}`;

                const whatsappAPI = `https://api.whatsapp.com/send?phone=${teacherWhatsAppNumber}&text=${encodeURIComponent(message)}`;

                showAlert('📱 تم التحقق من الكود بنجاح! جاري تحويلك للواتساب لإرسال رسالة التفعيل للمستر...', 'success');

                window.open(whatsappAPI, '_blank');

                localStorage.setItem('isFirstVerified', 'true');

                setTimeout(() => {
                    location.reload();
                }, 2000);

            } else if (!isAccountCreated) {
                const password = document.getElementById('newPassword').value;
                const confirmPass = document.getElementById('confirmPassword').value;
                const imageInput = document.getElementById('userImageFile');

                if (password !== confirmPass) {
                    showAlert('❌ كلمة السر غير متطابقة في الحقلين، تأكد منها.', 'error');
                    return;
                }

                if (!imageInput.files || !imageInput.files[0]) {
                    showAlert('❌ يجب اختيار وتحديد صورتك الشخصية للمنصة.', 'error');
                    return;
                }

                getBase64(imageInput.files[0], function(base64Image) {
                    let studentData = JSON.parse(localStorage.getItem('activeStudentData') || '{}');
                    studentData.password = password;
                    studentData.userImage = base64Image;

                    localStorage.setItem('activeStudentData', JSON.stringify(studentData));
                    localStorage.setItem('isAccountCreated', 'true');

                    showAlert('🎉 تم إنشاء حسابك الدائم بنجاح! جاري نقلك للمنصة الداخلية...', 'success');

                    setTimeout(() => {
                        window.location.href = 'platform.html';
                    }, 1500);
                });

            } else {
                const enteredPassword = document.getElementById('loginPassword').value;
                const savedData = JSON.parse(localStorage.getItem('activeStudentData') || '{}');

                if (savedData.password && savedData.password === enteredPassword) {
                    showAlert('🚀 تم التحقق من كلمة السر بنجاح! أهلاً بك في المنصة.', 'success');
                    setTimeout(() => {
                        window.location.href = 'platform.html';
                    }, 1000);
                } else {
                    showAlert('❌ كلمة السر غير صحيحة، حاول مرة أخرى.', 'error');
                }
            }
        }
    </script>

</body>
</html>
