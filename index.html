<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الفيزياء المتقدمة - مهندس محمد صلاح</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }
        body {
            background: #030712;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية فيزيائية حية بقوانين الكهربية والحديثة */
        .physics-background-formulas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            opacity: 0.18;
            pointer-events: none;
        }
        .formula {
            position: absolute;
            color: #38bdf8;
            font-weight: 900;
            font-size: 20px;
            animation: floatFormula 14s infinite linear;
        }
        @keyframes floatFormula {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        /* حاوية تسجيل الدخول الفخمة */
        .login-card {
            position: relative;
            z-index: 10;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 2px solid rgba(56, 189, 248, 0.35);
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.85), 0 0 35px rgba(14, 165, 233, 0.25);
            width: 100%;
            max-width: 520px;
            padding: 40px;
            text-align: center;
            margin: 20px;
        }

        /* برواز صورة المستر الاحترافية */
        .teacher-frame {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
        }
        .teacher-img-container {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #0ea5e9;
            box-shadow: 0 0 30px rgba(14, 165, 233, 0.6);
            background: #1e293b;
            position: relative;
            z-index: 2;
        }
        .teacher-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .teacher-frame::after {
            content: '';
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            border-radius: 50%;
            background: linear-gradient(45deg, #0ea5e9, #6366f1, #38bdf8);
            z-index: 1;
            opacity: 0.7;
            filter: blur(6px);
            animation: rotateGlow 6s linear infinite;
        }
        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .badge-title {
            display: inline-block;
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.2), rgba(99, 102, 241, 0.2));
            color: #38bdf8;
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 12px;
            border: 1px solid rgba(56, 189, 248, 0.4);
            letter-spacing: 1px;
        }
        h1 {
            font-size: 28px;
            color: #f8fafc;
            margin-bottom: 6px;
            font-weight: 900;
        }
        .subtitle {
            font-size: 13.5px;
            color: #94a3b8;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        /* حقول الإدخال */
        .input-group {
            margin-bottom: 18px;
            text-align: right;
        }
        label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: #cbd5e1;
            font-weight: 700;
        }
        input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(30, 41, 59, 0.75);
            border: 2px solid #334155;
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        input:focus {
            border-color: #0ea5e9;
            outline: none;
            background: rgba(15, 23, 42, 0.95);
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.4);
        }

        /* زر الدخول */
        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0ea5e9, #4f46e5);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 17px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.4);
        }
        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(14, 165, 233, 0.6);
            opacity: 0.95;
        }
    </style>
</head>
<body>

    <div class="physics-background-formulas">
        <span class="formula" style="left: 8%; animation-duration: 11s;">V = I × R</span>
        <span class="formula" style="left: 22%; animation-duration: 16s; animation-delay: 2s;">$\sum I = 0$ (كيرشوف)</span>
        <span class="formula" style="left: 38%; animation-duration: 13s; animation-delay: 1s;">$\sum V = \sum E_B$</span>
        <span class="formula" style="left: 55%; animation-duration: 15s; animation-delay: 4s;">$E = h\nu$ (بلانك)</span>
        <span class="formula" style="left: 70%; animation-duration: 12s; animation-delay: 3s;">$\lambda = \frac{h}{p}$ (دي برولي)</span>
        <span class="formula" style="left: 88%; animation-duration: 14s; animation-delay: 5s;">$P_w = \frac{V^2}{R}$</span>
        <span class="formula" style="left: 15%; animation-duration: 18s; animation-delay: 6s;">$emf = -N \frac{\Delta \Phi}{\Delta t}$</span>
    </div>

    <div class="login-card">
        <div class="badge-title">⚡ الفيزياء الكهربية والحديثة ⚡</div>
        
        <div class="teacher-frame">
            <div class="teacher-img-container">
                <img src="55.jpg" alt="مهندس محمد صلاح">
            </div>
        </div>

        <h1>مهندس / محمد صلاح</h1>
        <p class="subtitle">منصة الفيزياء المتقدمة لثانوية عامة - حيث تذوب أسرار الكهربية والحديثة بامتياز.</p>

        <form id="loginForm" onsubmit="handlePortalLogin(event)">
            <div class="input-group">
                <label for="username">اسم الطالب الثلاثي:</label>
                <input type="text" id="username" required placeholder="أدخل اسمك الكامل">
            </div>

            <div class="input-group">
                <label for="studentPhone">رقم تليفون الطالب:</label>
                <input type="tel" id="studentPhone" required placeholder="01xxxxxxxx0">
            </div>

            <div class="input-group">
                <label for="parentPhone">رقم تليفون ولي الأمر:</label>
                <input type="tel" id="parentPhone" required placeholder="01xxxxxxxx0">
            </div>

            <div class="input-group">
                <label for="platformCode">كود المنصة الخاص بك:</label>
                <input type="text" id="platformCode" required placeholder="أدخل كود الاشتراك السري">
            </div>

            <button type="submit" class="btn-login" id="submitBtn">دخول إلى المنصة التعليمية</button>
        </form>
    </div>

    <script>
        function handlePortalLogin(event) {
            event.preventDefault();

            const btn = document.getElementById('submitBtn');
            btn.innerText = "جاري التحقق وحفظ البيانات...";
            btn.disabled = true;

            const studentData = {
                name: document.getElementById('username').value,
                studentPhone: document.getElementById('studentPhone').value,
                parentPhone: document.getElementById('parentPhone').value,
                platformCode: document.getElementById('platformCode').value,
                loginTime: new Date().toLocaleString()
            };

            // تخزين البيانات مؤقتاً
            localStorage.setItem('mohamedSalahStudent', JSON.stringify(studentData));

            setTimeout(() => {
                alert('أهلاً بك يا ' + studentData.name + ' في منصة مستر محمد صلاح! تم تسجيل دخولك بنجاح.');
                btn.innerText = "دخول إلى المنصة التعليمية";
                btn.disabled = false;
                // هنا سنقوم بنقلك لصفحة الاختبارات التفاعلية (الصفحة الثانية)
            }, 1200);
        }
    </script>

</body>
</html>
