<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الفيزياء - مهندس محمد صلاح</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            // قم بوضع Public Key الخاص بك هنا لاحقاً من موقع EmailJS
            emailjs.init("YOUR_PUBLIC_KEY");
        })();
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #090d16, #1a233a);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(26, 35, 58, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 500px;
            padding: 35px;
            text-align: center;
        }
        /* تصميم مكان صورة المستر الاحترافية */
        .teacher-img-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 15px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
            background: #000;
        }
        .teacher-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* حروف وعبارات الفيزياء المبهرة */
        .physics-badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 12px;
            letter-spacing: 1px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        h1 {
            font-size: 26px;
            margin-bottom: 5px;
            color: #f8fafc;
            font-weight: 700;
        }
        .subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: right;
        }
        label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: #cbd5e1;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        input:focus {
            border-color: #38bdf8;
            outline: none;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0ea5e9, #1d4ed8);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(14, 165, 233, 0.3);
        }
        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="physics-badge">⚡ Physics Portal | E = mc² ⚡</div>
        
        <div class="teacher-img-container">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300" alt="Eng. Mohamed Salah">
        </div>

        <h1>Eng. Mohamed Salah</h1>
        <p class="subtitle">منصة الفيزياء الاحترافية - بوابتك لاحتراف أسرار الكون والقوانين الفيزيائية بأبسط الطرق.</p>

        <form id="loginForm" onsubmit="sendDataAndLogin(event)">
            <div class="form-group">
                <label for="username">اسم الطالب الثلاثي:</label>
                <input type="text" id="username" required placeholder="أدخل اسمك الكامل">
            </div>

            <div class="form-group">
                <label for="studentPhone">رقم تليفون الطالب:</label>
                <input type="tel" id="studentPhone" required placeholder="01xxxxxxxx0">
            </div>

            <div class="form-group">
                <label for="parentPhone">رقم تليفون ولي الأمر:</label>
                <input type="tel" id="parentPhone" required placeholder="01xxxxxxxx0">
            </div>

            <div class="form-group">
                <label for="platformCode">كود المنصة الخاص بك:</label>
                <input type="text" id="platformCode" required placeholder="أدخل كود الاشتراك السري">
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">تسجيل الدخول للمنصة</button>
        </form>
    </div>

    <script>
        function sendDataAndLogin(event) {
            event.preventDefault(); // منع إعادة تحميل الصفحة

            const btn = document.getElementById('submitBtn');
            btn.innerText = "جاري التحقق وإرسال البيانات...";
            btn.disabled = true;

            // جمع البيانات المدخلة
            const studentData = {
                name: document.getElementById('username').value,
                student_phone: document.getElementById('studentPhone').value,
                parent_phone: document.getElementById('parentPhone').value,
                platform_code: document.getElementById('platformCode').value,
                login_time: new Date().toLocaleString()
            };

            // حفظ بيانات الطالب محلياً للاستفادة منها في صفحة الاختبارات لاحقاً
            localStorage.setItem('activeStudent', JSON.stringify(studentData));

            // محاكاة الإرسال الفوري للسيرفر أو الإيميل (هنا يتم ربطها بـ EmailJS لاحقاً لتصلك رسالة فورية)
            setTimeout(() => {
                alert('مرحباً بك يا ' + studentData.name + '! تم تسجيل دخولك بنجاح وجاري نقلك للمنصة...');
                
                // الانتقال لصفحة الأسئلة (الصفحة الثانية التي سنصممها معاً)
                // window.location.href = 'exam.html';
                
                btn.innerText = "تسجيل الدخول للمنصة";
                btn.disabled = false;
            }, 1500);
        }
    </script>

</body>
</html>
