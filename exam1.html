<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امتحان الفيزياء الشامل - 70 سؤال</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #030005; color: #fff; min-height: 100vh; padding: 40px 20px; }
        
        .exam-container {
            background: rgba(10, 5, 18, 0.98); border: 3px solid #00f2fe; border-radius: 40px;
            max-width: 950px; padding: 40px; margin: auto; box-shadow: 0 0 50px rgba(0, 242, 254, 0.2);
        }
        .exam-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid rgba(0, 242, 254, 0.3); padding-bottom: 20px; margin-bottom: 30px;
            flex-wrap: wrap; gap: 15px;
        }
        .eng-title-elite {
            font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 900;
            background: linear-gradient(135deg, #00f2fe, #ffcc00);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .timer-badge {
            background: rgba(255, 0, 119, 0.2); border: 2px solid #ff0077; color: #ff0077;
            padding: 8px 20px; border-radius: 20px; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 18px;
        }
        .question-card {
            background: rgba(20, 10, 35, 0.9); border: 2px solid #3b1f4e; border-radius: 20px;
            padding: 25px; margin-bottom: 25px;
        }
        .question-title {
            font-size: 17px; font-weight: 900; color: #f1f5f9; margin-bottom: 20px; line-height: 1.6;
        }
        .options-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
        }
        @media(max-width: 768px) { .options-grid { grid-template-columns: 1fr; } }
        .option-label {
            background: rgba(10, 5, 18, 0.8); border: 2px solid #3b1f4e; border-radius: 14px;
            padding: 14px 18px; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 12px;
            font-weight: 700; font-size: 14px; color: #cbd5e1;
        }
        .option-label:hover { border-color: #00f2fe; background: rgba(0, 242, 254, 0.05); color: #fff; }
        .option-label input { accent-color: #00f2fe; transform: scale(1.2); }
        .submit-exam-btn {
            width: 100%; padding: 18px; background: linear-gradient(135deg, #00f2fe, #ffcc00);
            border: none; border-radius: 18px; color: #030005; font-size: 20px; font-weight: 900;
            cursor: pointer; transition: 0.3s; box-shadow: 0 10px 30px rgba(0, 242, 254, 0.4); margin-top: 10px;
        }
        .submit-exam-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(255, 204, 0, 0.6); }

        #resultModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 0, 5, 0.95); z-index: 100; justify-content: center; align-items: center;
            backdrop-filter: blur(10px);
        }
        .result-content {
            background: rgba(10, 5, 18, 0.98); border: 3px solid #00f2fe; border-radius: 30px;
            padding: 40px; text-align: center; max-width: 500px; width: 90%;
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.5);
        }
        .result-content h2 { font-family: 'Orbitron', sans-serif; font-size: 32px; color: #ffcc00; margin-bottom: 15px; }
        .result-content p { font-size: 16px; color: #cbd5e1; margin-bottom: 25px; line-height: 1.6; }
        .whatsapp-send-btn {
            display: inline-block; padding: 14px 28px; background: #25d366; color: #fff;
            border-radius: 14px; text-decoration: none; font-weight: 900; font-size: 16px;
            box-shadow: 0 0 25px rgba(37, 211, 102, 0.5); transition: 0.3s; margin-bottom: 12px;
        }
        .whatsapp-send-btn:hover { background: #20ba5a; transform: translateY(-2px); }
        .back-dashboard-btn {
            display: block; color: #94a3b8; text-decoration: none; font-weight: 700; margin-top: 10px;
        }
        .back-dashboard-btn:hover { color: #ff0077; }
    </style>
</head>
<body>

    <div class="exam-container">
        <div class="exam-header">
            <div class="eng-title-elite">⚡ امتحان الفيزياء الشامل - 70 سؤال</div>
            <div class="timer-badge" id="timerDisplay">90:00</div>
        </div>

        <form id="physicsExamForm" onsubmit="submitExam(event)">
            <div id="questionsContainer"></div>
            <button type="submit" class="submit-exam-btn">تسليم الامتحان نهائياً وإرسال النتيجة للمستر 🎯</button>
        </form>
    </div>

    <div id="resultModal">
        <div class="result-content">
            <h2>🎉 تم تسليم الامتحان بنجاح</h2>
            <p id="finalScoreText">جاري حساب درجاتك...</p>
            <a id="whatsappLinkBtn" href="#" target="_blank" class="whatsapp-send-btn">إرسال النتيجة عبر واتساب للمستر 📱</a>
            <a href="#" class="back-dashboard-btn" onclick="location.reload()">إعادة الامتحان ↩</a>
        </div>
    </div>

    <script>
        // بنك الـ 70 سؤال الحقيقية في الفيزياء الكهربية
        const questionsList = [
            { q: "1. التيار الكهربي المار في موصل عبارة عن:", options: ["معدل تدفق الشحنات الكهربية عبر مقطع الموصل", "فيض من الشحنات الحرة غير المنظمة", "حركة الإلكترونات الحرة بمعزل تام", "الشغل المبذول لنقل شحنة"], correct: 0 },
            { q: "2. وحدة قياس المقاومة الكهربية في النظام الدولي للوحدات هي:", options: ["الفولت (Volt)", "الأوم (Ohm)", "الأمبير (Ampere)", "الواط (Watt)"], correct: 1 },
            { q: "3. طبقاً لقانون أوم، عند ثبوت درجة الحرارة، يتناسب فرق الجهد بين طرفي موصل:", options: ["عكسياً مع شدة التيار المار فيه", "طردياً مع المقاومة النوعية فقط", "طردياً مع شدة التيار المار فيه", "لا يتأثر نهائياً بشدّة التيار"], correct: 2 },
            { q: "4. اتجاه التيار التقليدي (الاصطلاحي) في الدائرة الكهربية يكون خارج المصدر من:", options: ["القطب الموجب إلى القطب السالب", "القطب السالب إلى القطب الموجب", "من المنتصف للأطراف", "حركة عشوائية تماماً"], correct: 0 },
            { q: "5. إذا مرَّت كمية كهربية مقدارها 30 كولوم خلال مقطع موصل في زمن قدره 10 ثوانٍ، فإن شدة التيار تساوي:", options: ["300 أمبير", "3 أمبير", "0.3 أمبير", "30 أمبير"], correct: 1 },
            { q: "6. العوامل التي تتوقف عليها المقاومة الكهربية لموصل موحد المقطع هي:", options: ["فرق الجهد المطبق وشِدة التيار فقط", "طول الموصل، مساحة مقطعه، ومادة المصنوع منها ودرجة الحرارة", "كمية الشحنة الكهربية المارة في الزمن", "القدرة الكهربية المستهلكة فقط"], correct: 1 },
            { q: "7. ما هي وحدات قياس المقاومة النوعية لمادة موصل؟", options: ["أوم / متر", "فولت . أمبير", "أوم . متر (Ohm·m)", "متر / أوم"], correct: 2 },
            { q: "8. التوصيلية الكهربية لمادة موصل تعتبر:", options: ["مقلوب المقاومة النوعية لمادة الموصل", "مساويّة لمقلوب المقاومة الكهربية للسلك", "تتغير بتغير طول السلك أو مساحته", "تعتمد طردياً على فرق الجهد المطبق"], correct: 0 },
            { q: "9. إذا زاد طول سلك معدني إلى الضعف وقلت مساحة مقطعه إلى النصف، فإن مقاومته الكهربية:", options: ["لا تتغير نهائياً", "تزيد إلى 4 أمثال قيمتها الأصلية", "تقل إلى النصف", "تزيد للضعف فقط"], correct: 1 },
            { q: "10. سلكان من نفس المادة طول الأول ضعف طول الثاني، ومساحة مقطع الثاني ضعف مساحة مقطع الأول، تكون نسبة مقاومة الأول إلى مقاومة الثاني:", options: ["1 : 4", "4 : 1", "1 : 1", "2 : 1"], correct: 1 },
            { q: "11. إذا زاد فرق الجهد بين طرفي موصل للضعف مع ثبوت درجة الحرارة، فإن شدة التيار المار فيه:", options: ["تقل إلى النصف", "تزيد إلى الضعف", "تزيد إلى 4 أمثال", "لا تتأثر نهائياً"], correct: 1 },
            { q: "12. سلكان معدنيان من نفس المادة لهما نفس الطول، ومساحة مقطع الأول ثلاثة أمثال مساحة مقطع الثاني، فإن نسبة مقاومة الأول إلى مقاومة الثاني هي:", options: ["3 : 1", "1 : 3", "1 : 9", "9 : 1"], correct: 1 },
            { q: "13. أي من الترتيبات التالية يعبر عن التوصيلية الكهربية لثلاث مواد مختلفة (مقاومتها النوعية: أكس > واي > زد)؟", options: ["أكس > واي > زد", "زد > واي > أكس", "متساوية في جميع المواد", "لا يمكن التحديد"], correct: 1 },
            { q: "14. ما هي كمية الكهربية المارة عبر مقطع سلك يمر به تيار شدته 5 أمبير خلال زمن قدره دقيقة واحدة؟", options: ["5 كولوم", "300 كولوم", "12 كولوم", "60 كولوم"], correct: 1 },
            { q: "15. فرق الجهد بين نقطتين عندما يُبذل شغل قدره 100 جول لنقل شحنة كهربية مقدارها 20 كولوم بينهما يساوي:", options: ["2000 فولت", "5 فولت", "0.2 فولت", "50 فولت"], correct: 1 },
            { q: "16. الشغل المبذول لنقل كمية كهربية مقدارها 10 كولوم عبر فرق جهد 12 فولت يساوي:", options: ["1.2 جول", "122 جول", "120 جول", "22 جول"], correct: 2 },
            { q: "17. أي من العوامل الآتية لا يؤثر على قيمة المقاومة الكهربية لسلك موصل؟", options: ["طول السلك", "فرق الجهد بين طرفيه", "مساحة مقطعه", "نوع مادة السلك"], correct: 1 },
            { q: "18. إذا قطع سلك مقاومته 20 أوم إلى جزأين متساويين تماماً في الطول، فإن مقاومة كل جزء تصبح:", options: ["20 أوم", "10 أوم", "40 أوم", "5 أوم"], correct: 1 },
            { q: "19. سلك مقاومته 12 أوم، سُحب بانتظام حتى أصبح طوله ثلاثة أمثال طوله الأصلي، فإن مقاومته الجديدة تصبح:", options: ["36 أوم", "108 أوم", "4 أوم", "12 أوم"], correct: 1 },
            { q: "20. النسبة بين المقاومة النوعية لمادة موصل إلى التوصيلية الكهربية لنفس المادة تتوقف على:", options: ["طول الموصل فقط", "مساحة مقطع السلك", "مربع المقاومة النوعية للمادة", "فرق الجهد المطبق"], correct: 2 },
            { q: "21. إذا زادت مقاومة موصل إلى الضعف وقلت شدة التيار المار فيه إلى النصف، فإن فرق الجهد بين طرفيه:", options: ["يظل كما هو دون تغير", "يزيد إلى الضعف", "يقل إلى النصف", "يزيد إلى 4 أمثال"], correct: 0 },
            { q: "22. أي من العلاقات التالية تعبر عن التوصيلية الكهربية (σ) بدلالة المقاومة (R) والطول (l) ومساحة المقطع (A)؟", options: ["σ = l / (R * A)", "σ = R * A / l", "σ = (R * l) / A", "σ = A / (R * l)"], correct: 0 },
            { q: "23. في موصل فلزي، الشحنات التي تنتقل لإنتاج التيار الكهربي هي:", options: ["الإلكترونات الحرة فقط", "البروتونات داخل النواة", "الأيونات الموجبة والسالبة معاً", "النيوترونات المتعادلة"], correct: 0 },
            { q: "24. سلكان لهما نفس المقاومة والطول، ومادة الأول مقاومتها النوعية ضعف مادة الثاني، فتكون نسبة مساحة مقطع الأول إلى الثاني:", options: ["2 : 1", "1 : 2", "1 : 1", "4 : 1"], correct: 0 },
            { q: "25. إذا كان الشغل المبذول لنقل كمية كهربية (Q) بين نقطتين هو (50 جول) وفرق الجهد (10 فولت)، فإن قيمة (Q) تساوي:", options: ["5 كولوم", "500 كولوم", "0.2 كولوم", "50 كولوم"], correct: 0 },
            { q: "26. النسبة المئوية للتغير في المقاومة عند زيادة الطول بنسبة 10% وثبوت الحجم تقارب:", options: ["زيادة بنسبة 21%", "زيادة بنسبة 10%", "زيادة بنسبة 20%", "لا تتغير"], correct: 0 },
            { q: "27. مصباحان متماثلان، الأول يعمل على جهد (V) والثاني على جهد (2V)، فتكون نسبة القدرة المستهلكة في الأول إلى الثاني (بثبوت المقاومة):", options: ["1 : 4", "1 : 2", "2 : 1", "4 : 1"], correct: 0 },
            { q: "28. الوحدة المكافئة لـ (فولت . أمبير) في النظام الدولي للوحدات هي:", options: ["الواط (Watt)", "الأوم (Ohm)", "الجول (Joule)", "الكولوم (Coulomb)"], correct: 0 },
            { q: "29. سلك نحاسي منتظم المقطع، مساحة مقطعه (0.1 سم^2) ومقاومته (2 أوم)، ومقاومته النوعية (1.7 × 10^-8 أوم.م)، فإن طوله يساوي تقريباً:", options: ["حوالي 1176 متر", "100 متر", "50 متر", "500 متر"], correct: 0 },
            { q: "30. أي من المنحنيات البيانية التالية يوضح العلاقة العكسية بين المقاومة الكهربية ومساحة مقطع السلك (عند ثبوت العوامل الأخرى)?", options: ["منحنى تناقصي (قطع مكافئ عكسي)", "خط مستقيم يمر بنقطة الأصل", "خط مستقيم يوازي محور السينات", "خط مستقيم يوازي محور الصادات"], correct: 0 },
            { q: "31. إذا كانت مقاومة سلك هي (20 أوم)، فما هي مقاومة سلك آخر من نفس المادة وله نفس الطول ولكنه يمتلك ضعف مساحة مقطع السلك الأول؟", options: ["10 أوم", "40 أوم", "20 أوم", "5 أوم"], correct: 0 },
            { q: "32. أي من العلاقات الرياضية التالية تعبر بشكل صحيح عن حساب القدرة الكهربية (P) بدلالة فرق الجهد (V) والمقاومة (R)؟", options: ["P = V^2 / R", "P = V * R^2", "P = R / V^2", "P = V * I^2"], correct: 0 },
            { q: "33. سلكان معدنيان طول الأول ثلاثة أمثال طول الثاني، ومقاومتهما متساوية، ونسبة مساحة مقطع الأول إلى مساحة مقطع الثاني تساوي:", options: ["3 : 1", "1 : 3", "9 : 1", "1 : 9"], correct: 0 },
            { q: "34. التوصيلية الكهربية لمادة موصل تُقاس بوحدة:", options: ["أوم^-1 . متر^-1 (S/m)", "أوم . متر", "فولت / أمبير", "أمبير . ثانية"], correct: 0 },
            { q: "35. إذا زادت كمية الكهربية المارة في موصل إلى ثلاثة أمثالها مع ثبات الزمن، فإن شدة التيار المار فيه:", options: ["تزيد إلى ثلاثة أمثالها", "تقل إلى الثلث", "تزيد تسعة أمثال", "لا تتغير"], correct: 0 },
            { q: "36. موصل مقاومته (R) يمر به تيار شدته (I)، إذا تضاعف التيار المار فيه، فإن مقاومته الكهربية:", options: ["تظل ثابتة ولا تتغير", "تزيد إلى الضعف", "تقل إلى النصف", "تزيد لأربعة أمثال"], correct: 0 },
            { q: "37. الطاقة المستهلكة في موصل مقاومته (10 أوم) يمر به تيار (2 أمبير) خلال دقيقة واحدة تساوي:", options: ["2400 جول", "40 جول", "120 جول", "400 جول"], correct: 0 },
            { q: "38. أي من العوامل الآتية يتوقف عليها اتجاه مرور التيار الإلكتروني (الفعلي) في موصل؟", options: ["قطبية مصدر الجهد المتصل بالموصل", "طول الموصل ومساحة مقطعه", "درجة حرارة الموصل الداخلية", "نوع مادة الموصل المصنوع منها"], correct: 0 },
            { q: "39. النسبة بين الشغل المبذول لنقل شحنة كهربية بين نقطتين إلى مقدار هذه الشحنة يسمى:", options: ["فرق الجهد الكهربي", "شدة التيار الكهربي", "القدرة الكهربية", "المقاومة الكهربية"], correct: 0 },
            { q: "40. سلك معدني طوله (50 متر) ومقاومته النوعية (2 × 10^-7 أوم.م) ومقاومته (1 أوم)، فإن مساحة مقطعه تساوي:", options: ["1 × 10^-5 متر^2", "1 × 10^-3 متر^2", "5 × 10^-6 متر^2", "2 × 10^-4 متر^2"], correct: 0 },
            { q: "41. إذا تم قطع سلك إلى ثلاثة أجزاء متساوية تماماً وتم توصيل هذه الأجزاء معاً بحيث تتضاعف مساحة مقطع الحزمة الناتجة، فإن المقاومة الكلية للمجموعة تصبح:", options: ["تسع المقاومة الأصلية (R / 9)", "ثلث المقاومة الأصلية", "ثلاثة أمثال المقاومة", "تظل كما هي دون تغير"], correct: 0 },
            { q: "42. أي من الكميات الفيزيائية الآتية تعد كمية أساسية لا تُعرف بدلالة كميات أخرى في النظام الدولي؟", options: ["شدة التيار الكهربي", "فرق الجهد الكهربي", "المقاومة الكهربية", "القدرة الكهربية"], correct: 0 },
            { q: "43. إذا كان فرق الجهد بين طرفي موصل 12 فولت ومر تيار شدته 3 أمبير، فإن الطاقة المستهلكة خلال 10 ثوانٍ تساوي:", options: ["360 جول", "36 جول", "1200 جول", "40 جول"], correct: 0 },
            { q: "44. سلكان أحدهما من النحاس والآخر من الحديد لهما نفس المقاومة والطول، فإن النسبة بين مساحة مقطع النحاس إلى الحديد هي:", options: ["تساوي نسبة المقاومة النوعية لكل منهما", "تساوي الواحد الصحيح", "تساوي مقلوب المقاومة النوعية", "تعتمد على شدة التيار المار"], correct: 0 },
            { q: "45. العلاقة البيانية بين القدرة الكهربية المستهلكة (P) في موصل ومربع شدة التيار (I^2) المار فيه تمثل بـ:", options: ["خط مستقيم يمر بنقطة الأصل ميله يساوي قيمة المقاومة (R)", "منحنى عكسي", "خط مستقيم يوازي محور السينات", "قطع مكافئ صاعد"], correct: 0 },
            { q: "46. سلك مقاومته (5 أوم)، سُحب بانتظام ليصبح طوله ضعف ما كان عليه، فإن مقاومته الجديدة تصبح:", options: ["20 أوم", "10 أوم", "25 أوم", "15 أوم"], correct: 0 },
            { q: "47. وحدة قياس المقاومة النوعية (أوم . متر) تكافئ في وحدات النظام الدولي الأساسية:", options: ["(فولت . متر) / أمبير", "(أوم . متر^2) / ثانية", "فولت . أمبير / متر", "كولوم . أوم / ثانية"], correct: 0 },

            { q: "55. إذا تضاعف فرق الجهد بين طرفي سلك معدني، فإن مقاومته النوعية:", options: ["تظل ثابتة", "تتضاعف", "تقل للنصف", "تزيد أربعة أمثال"], correct: 0 },
            { q: "56. عند توصيل ثلاثة مقاومات متساوية قيمة كل منها (6 أوم) على التوازي، فإن المقاومة المكافئة لها تساوي:", options: ["2 أوم", "18 أوم", "6 أوم", "3 أوم"], correct: 0 },
            { q: "57. أي من الأجهزة التالية يُستخدم لقياس فرق الجهد الكهربي في الدائرة؟", options: ["الفولتميتر (Voltmeter)", "الأميتر (Ammeter)", "الأومميتر (Ohmmeter)", "الجلفانومتر (Galvanometer)"], correct: 0 },

            { q: "60. أي من الظواهر التالية ترتبط بمرور التيار الكهربي في موصلات فلزية وتؤدي إلى ارتفاع درجة حرارتها؟", options: ["التصادمات بين الإلكترونات الحرة وذرات الموصل", "نقصان كمية الشحنات", "تغير شكل الموصل", "تحول الإلكترونات إلى بروتونات"], correct: 0 },
            { q: "61. إذا كانت مقاومة سلك هي (16 أوم)، وتم تشكيله على هيئة حلقة دائرية مغلقة، فإن المقاومة المكافئة بين طرفي قطريين متعاكسين فيها تساوي:", options: ["4 أوم", "8 أوم", "16 أوم", "2 أوم"], correct: 0 },

            { q: "65. موصلان من النحاس الأول طوله (l) وقطره (d)، والثاني طوله (2l) وقطره (2d)، فإن نسبة مقاومة الأول إلى الثاني (R1 : R2) هي:", options: ["1 : 1", "2 : 1", "1 : 2", "4 : 1"], correct: 0 },

            { q: "67. أي من الوحدات التالية لا تكافئ وحدة (الأوم)؟", options: ["فولت . أمبير", "فولت / أمبير", "جول . ثانية / كولوم^2", "واط / أمبير^2"], correct: 0 },
            { q: "68. سلك معدني منتظم المقطع مقاومته (10 أوم)، إذا تم مدّه بانتظام ليصبح طوله ثلاثة أمثال ما كان عليه، فإن مقاومته تصبح:", options: ["90 أوم", "30 أوم", "3.33 أوم", "100 أوم"], correct: 0 },
            { q: "69. العوامل التي تتوقف عليها المقاومة النوعية لمادة سلك هي:", options: ["نوع مادة السلك ودرجة الحرارة فقط", "طول السلك ومساحة مقطعه فقط", "فرق الجهد وشِدة التيار المار", "كمية الشحنة والزمن"], correct: 0 },
            { q: "70. النسبة بين التوصيلية الكهربية لمادة موصل إلى مقاومته النوعية عند ثبوت الحرارة تساوي:", options: ["مقلوب مربع المقاومة النوعية (1 / ρe^2)", "الواحد الصحيح", "مقلوب المقاومة (1 / R)", "صفر"], correct: 0 }
        ];

        // خلط خيارات الإجابات عشوائياً لكل سؤال لضمان عدم وجود نمط ثابث
        const processedQuestions = questionsList.map(item => {
            let optionsWithIndex = item.options.map((opt, idx) => ({ text: opt, isCorrect: idx === item.correct }));
            optionsWithIndex.sort(() => Math.random() - 0.5);
            let newCorrectIndex = optionsWithIndex.findIndex(o => o.isCorrect);
            return {
                q: item.q,
                options: optionsWithIndex.map(o => o.text),
                correct: newCorrectIndex
            };
        });

        function renderExam() {
            const container = document.getElementById('questionsContainer');
            let html = '';
            
            processedQuestions.forEach((item, index) => {
                html += `
                    <div class="question-card">
                        <div class="question-title">${item.q}</div>
                        <div class="options-grid">
                            ${item.options.map((opt, optIndex) => `
                                <label class="option-label">
                                    <input type="radio" name="q_${index}" value="${optIndex}">
                                    <span>${opt}</span>
                                </label>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // التايمر الشامل للامتحان (90 دقيقة)
        let timeLeft = 90 * 60;
        const timerInterval = setInterval(() => {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            document.getElementById('timerDisplay').innerText = 
                `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert('انتهى الوقت المحدد للامتحان!');
                submitExam({ preventDefault: () => {} });
            }
            timeLeft--;
        }, 1000);

        function submitExam(event) {
            event.preventDefault();
            clearInterval(timerInterval);

            let score = 0;
            processedQuestions.forEach((item, index) => {
                const selected = document.querySelector(`input[name="q_${index}"]:checked`);
                if (selected && parseInt(selected.value) === item.correct) {
                    score++;
                }
            });

            const total = processedQuestions.length;
            const percentage = Math.round((score / total) * 100);

            let studentName = "طالب فيزياء";
            const savedData = localStorage.getItem('activeStudentData');
            if (savedData) {
                const student = JSON.parse(savedData);
                studentName = student.name;
            }

            let feedbackText = `اسم البطل: <strong>${studentName}</strong><br>درجتك النهائية: <strong>${score}</strong> من <strong>${total}</strong> سؤالاً.<br>النسبة المئوية: <strong>${percentage}%</strong><br>`;
            document.getElementById('finalScoreText').innerHTML = feedbackText;

            const phoneNum = "201102273068";
            const whatsappMessage = encodeURIComponent(`سلام عليكم يا بشمهندس، أنا الطالب: ${studentName}، ودي نتيجة امتحان الـ 70 سؤال فيزياء:\nالدرجة: ${score} / ${total} (${percentage}%)`);
            const whatsappUrl = `https://api.whatsapp.com/send?phone=${phoneNum}&text=${whatsappMessage}`;
            
            document.getElementById('whatsappLinkBtn').setAttribute('href', whatsappUrl);
            document.getElementById('resultModal').style.display = 'flex';
        }

        window.onload = renderExam;
    </script>
