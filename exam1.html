<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امتحان (1) الشامل - 200 سؤال فيزياء ثانوية عامة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #030005; color: #fff; min-height: 100vh; overflow-x: hidden; position: relative; padding: 40px 20px; }
        
        .quantum-bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle at 85% 20%, rgba(0, 242, 254, 0.15) 0%, transparent 40%),
                              radial-gradient(circle at 15% 80%, rgba(255, 204, 0, 0.15) 0%, transparent 40%);
            z-index: 0; pointer-events: none;
        }

        .exam-container {
            position: relative; z-index: 10; background: rgba(10, 5, 18, 0.95);
            backdrop-filter: blur(40px); border: 3px solid transparent;
            background-image: linear-gradient(rgba(10, 5, 18, 0.98), rgba(10, 5, 18, 0.98)), linear-gradient(135deg, #00f2fe, #ffcc00, #ff0077);
            background-origin: border-box; background-clip: padding-box, border-box;
            border-radius: 40px; box-shadow: 0 50px 100px rgba(0, 0, 0, 0.95), 0 0 50px rgba(0, 242, 254, 0.2);
            width: 100%; max-width: 950px; padding: 40px; margin: auto;
        }

        .exam-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid rgba(0, 242, 254, 0.3); padding-bottom: 20px; margin-bottom: 30px;
            flex-wrap: wrap; gap: 15px;
        }
        .eng-title-elite {
            font-family: 'Orbitron', sans-serif; font-size: 18px; font-weight: 900;
            background: linear-gradient(135deg, #00f2fe, #ffcc00);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .timer-badge {
            background: rgba(255, 0, 119, 0.2); border: 2px solid #ff0077; color: #ff0077;
            padding: 8px 20px; border-radius: 20px; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 18px;
            box-shadow: 0 0 20px rgba(255, 0, 119, 0.4);
        }

        .question-card {
            background: rgba(20, 10, 35, 0.9); border: 2px solid #3b1f4e; border-radius: 20px;
            padding: 25px; margin-bottom: 25px;
        }
        .question-title {
            font-size: 17px; font-weight: 900; color: #f1f5f9; margin-bottom: 20px; line-height: 1.6;
        }

        .options-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
        }
        @media(max-width: 768px) { .options-grid { grid-template-columns: 1fr; } }

        .option-label {
            background: rgba(10, 5, 18, 0.8); border: 2px solid #3b1f4e; border-radius: 14px;
            padding: 14px 18px; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 12px;
            font-weight: 700; font-size: 14px; color: #cbd5e1;
        }
        .option-label:hover { border-color: #00f2fe; background: rgba(0, 242, 254, 0.05); color: #fff; }
        .option-label input { accent-color: #00f2fe; transform: scale(1.2); }

        .option-label.correct-selected { border-color: #00ff80; background: rgba(0, 255, 128, 0.15); color: #00ff80; }
        .option-label.wrong-selected { border-color: #ff0055; background: rgba(255, 0, 85, 0.15); color: #ff4d88; }

        .feedback-note { margin-top: 12px; font-size: 13px; font-weight: 800; display: none; line-height: 1.5; }

        .submit-exam-btn {
            width: 100%; padding: 18px; background: linear-gradient(135deg, #00f2fe, #ffcc00);
            border: none; border-radius: 18px; color: #030005; font-size: 20px; font-weight: 900;
            cursor: pointer; transition: 0.3s; box-shadow: 0 10px 30px rgba(0, 242, 254, 0.4); margin-top: 10px;
        }
        .submit-exam-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(255, 204, 0, 0.6); }

        #resultModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 0, 5, 0.95); z-index: 100; justify-content: center; align-items: center;
            backdrop-filter: blur(10px);
        }
        .result-content {
            background: rgba(10, 5, 18, 0.98); border: 3px solid #00f2fe; border-radius: 30px;
            padding: 40px; text-align: center; max-width: 500px; width: 90%;
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.5);
        }
        .result-content h2 { font-family: 'Orbitron', sans-serif; font-size: 32px; color: #ffcc00; margin-bottom: 15px; }
        .result-content p { font-size: 16px; color: #cbd5e1; margin-bottom: 25px; line-height: 1.6; }
        .whatsapp-send-btn {
            display: inline-block; padding: 14px 28px; background: #25d366; color: #fff;
            border-radius: 14px; text-decoration: none; font-weight: 900; font-size: 16px;
            box-shadow: 0 0 25px rgba(37, 211, 102, 0.5); transition: 0.3s; margin-bottom: 12px;
        }
        .whatsapp-send-btn:hover { background: #20ba5a; transform: translateY(-2px); }
        .back-dashboard-btn {
            display: block; color: #94a3b8; text-decoration: none; font-weight: 700; margin-top: 10px;
        }
        .back-dashboard-btn:hover { color: #ff0077; }
    </style>
</head>
<body>

    <div class="quantum-bg-grid"></div>

    <div class="exam-container">
        <div class="exam-header">
            <div class="eng-title-elite">⚡ امتحان (1) - 200 سؤال شامل (الدرس الأول)</div>
            <div class="timer-badge" id="timerDisplay">180:00</div>
        </div>

        <form id="physicsExamForm" onsubmit="submitExam(event)">
            <div id="questionsContainer"></div>
            <button type="submit" class="submit-exam-btn">تسليم الامتحان وإرسال النتيجة عبر الواتساب 🎯</button>
        </form>
    </div>

    <div id="resultModal">
        <div class="result-content">
            <h2>🎉 انتهى الامتحان بنجاح</h2>
            <p id="finalScoreText">جاري حساب درجاتك...</p>
            <a id="whatsappLinkBtn" href="#" target="_blank" class="whatsapp-send-btn">إرسال النتيجة عبر واتساب 📱</a>
            <a href="exams.html" class="back-dashboard-btn">العودة لقائمة الامتحانات ↩</a>
        </div>
    </div>

    <script>
        // بنك الـ 200 سؤال كاملة ومفصلة للدرس الأول فيزياء ثالثة ثانوي
        const baseQuestions = [
            { q: "1. التيار الكهربي المار في موصل عبارة عن:", options: ["معدل تدفق الشحنات الكهربية عبر مقطع الموصل", "فيض من الشحنات الحرة غير المنظمة", "حركة الإلكترونات الحرة بمعزل تام", "الشغل المبذول لنقل شحنة"], correct: 0, exp: "التوضيح: شدة التيار هي كمية الكهربية المارة خلال مقطع معين في ثانية واحدة." },
            { q: "2. وحدة قياس المقاومة الكهربية في النظام الدولي للوحدات هي:", options: ["الأوم (Ohm)", "الفولت (Volt)", "الأمبير (Ampere)", "الواط (Watt)"], correct: 0, exp: "التوضيح: الأوم هو وحدة قياس المقاومة الكهربية للموصل." },
            { q: "3. طبقاً لقانون أوم، عند ثبوت درجة الحرارة، يتناسب فرق الجهد بين طرفي موصل:", options: ["طردياً مع شدة التيار المار فيه", "عكسياً مع شدة التيار المار فيه", "طردياً مع المقاومة النوعية فقط", "لا يتأثر نهائياً بشدّة التيار"], correct: 0, exp: "التوضيح: قانون أوم يؤكد تناسب الجهد طردياً مع شدة التيار." },
            { q: "4. اتجاه التيار التقليدي (الاصطلاحي) في الدائرة الكهربية يكون خارج المصدر من:", options: ["القطب الموجب إلى القطب السالب", "القطب السالب إلى القطب الموجب", "من المنتصف للأطراف", "حركة عشوائية تماماً"], correct: 0, exp: "التوضيح: يصطلح على حركة الشحنات الموجبة من القطب الموجب إلى السالب خارج المصدر." },
            { q: "5. إذا مرَّت كمية كهربية مقدارها 30 كولوم خلال مقطع موصل في زمن قدره 10 ثوانٍ، فإن شدة التيار تساوي:", options: ["3 أمبير", "300 أمبير", "0.3 أمبير", "30 أمبير"], correct: 0, exp: "التوضيح: من العلاقة (I = Q / t) إذن 30 ÷ 10 = 3 أمبير." },
            { q: "6. العوامل التي تتوقف عليها المقاومة الكهربية لموصل موحد المقطع هي:", options: ["طول الموصل، مساحة مقطعه، ومادة المصنوع منها ودرجة الحرارة", "فرق الجهد المطبق وشِدة التيار فقط", "كمية الشحنة الكهربية المارة في الزمن", "القدرة الكهربية المستهلكة فقط"], correct: 0, exp: "التوضيح: تتوقف المقاومة على الأبعاد (l, A) ومقاومة المادة (ρe) ودرجة الحرارة." },
            { q: "7. ما هي وحدات قياس المقاومة النوعية لمادة موصل؟", options: ["أوم . متر (Ohm·m)", "أوم / متر", "فولت . أمبير", "متر / أوم"], correct: 0, exp: "التوضيح: من قانون (ρe = R * A / l) وحدة القياس هي أوم في متر." },
            { q: "8. التوصيلية الكهربية لمادة موصل تعتبر:", options: ["مقلوب المقاومة النوعية لمادة الموصل", "مساويّة لمقلوب المقاومة الكهربية للسلك", "تتغير بتغير طول السلك أو مساحته", "تعتمد طردياً على فرق الجهد المطبق"], correct: 0, exp: "التوضيح: التوصيلية (σ) هي مقلوب المقاومة النوعية (1 / ρe)." },
            { q: "9. إذا زاد طول سلك معدني إلى الضعف وقلت مساحة مقطعه إلى النصف، فإن مقاومته الكهربية:", options: ["تزيد إلى 4 أمثال قيمتها الأصلية", "لا تتغير نهائياً", "تقل إلى النصف", "تزيد للضعف فقط"], correct: 0, exp: "التوضيح: (R ∝ l / A)، بطول (×2) ومساحة (÷0.5)، يصبح التأثير النهائي 4 أمثال." },
            { q: "10. سلكان من نفس المادة طول الأول ضعف طول الثاني، ومساحة مقطع الثاني ضعف مساحة مقطع الأول، تكون نسبة مقاومة الأول إلى مقاومة الثاني:", options: ["4 : 1", "1 : 4", "1 : 1", "2 : 1"], correct: 0, exp: "التوضيح: (R1/R2 = (l1/l2) * (A2/A1) = (2/1) * (2/1) = 4/1)." },
    { q: "11. إذا زاد فرق الجهد بين طرفي موصل للضعف مع ثبات درجة الحرارة، فإن شدة التيار المار فيه:", options: ["تزيد إلى الضعف", "تقل إلى النصف", "تزيد إلى 4 أمثال", "لا تتأثر نهائياً"], correct: 0, exp: "التوضيح: طبقاً لقانون أوم (V = I * R)، الجهد يتناسب طردياً مع شدة التيار عند ثبوت المقاومة." },
    { q: "12. سلكان معدنيان من نفس المادة لهما نفس الطول، ومساحة مقطع الأول ثلاثة أمثال مساحة مقطع الثاني، فإن نسبة مقاومة الأول إلى مقاومة الثاني هي:", options: ["1 : 3", "3 : 1", "1 : 9", "9 : 1"], correct: 0, exp: "التوضيح: المقاومة تتناسب عكسياً مع مساحة المقطع (R ∝ 1 / A)، إذن نسبة الأول للثاني تساوي مساحة الثاني للأول (1/3)." },
    { q: "13. أي من الترتيبات التالية يعبر عن التوصيلية الكهربية لثلاث مواد مختلفة (مقاومتها النوعية: أكس > واي > زد)؟", options: ["زد > واي > أكس", "أكس > واي > زد", "متساوية في جميع المواد", "لا يمكن التحديد"], correct: 0, exp: "التوضيح: التوصيلية (σ) مقلوب المقاومة النوعية (1 / ρe)، لذا الأقل مقاومة نوعية هو الأكبر توصيلية." },
    { q: "14. ما هي كمية الكهربية المارة عبر مقطع سلك يمر به تيار شدته 5 أمبير خلال زمن قدره دقيقة واحدة؟", options: ["300 كولوم", "5 كولوم", "12 كولوم", "60 كولوم"], correct: 0, exp: "التوضيح: من العلاقة (Q = I * t)، الزمن 60 ثانية، إذن 5 * 60 = 300 كولوم." },
    { q: "15. فرق الجهد بين نقطتين عندما يُبذل شغل قدره 100 جول لنقل شحنة كهربية مقدارها 20 كولوم بينهما يساوي:", options: ["5 فولت", "2000 فولت", "0.2 فولت", "50 فولت"], correct: 0, exp: "التوضيح: من قانون الجهد (V = W / Q)، إذن 100 ÷ 20 = 5 فولت." },
    { q: "16. الشغل المبذول لنقل كمية كهربية مقدارها 10 كولوم عبر فرق جهد 12 فولت يساوي:", options: ["120 جول", "1.2 جول", "122 جول", "22 جول"], correct: 0, exp: "التوضيح: الشغل (W = V * Q)، إذن 12 * 10 = 120 جول." },
    { q: "17. أي من العوامل الآتية لا يؤثر على قيمة المقاومة الكهربية لسلك موصل؟", options: ["فرق الجهد بين طرفيه", "طول السلك", "مساحة مقطعه", "نوع مادة السلك"], correct: 0, exp: "التوضيح: المقاومة خاصية فيزيائية تحددها الأبعاد والمادة ودرجة الحرارة، ولا تتغير بتغير الجهد أو التيار." },
    { q: "18. إذا قطع سلك مقاومته 20 أوم إلى جزأين متساويين تماماً في الطول، فإن مقاومة كل جزء تصبح:", options: ["10 أوم", "20 أوم", "40 أوم", "5 أوم"], correct: 0, exp: "التوضيح: بنقص الطول للنصف تصبح المقاومة نصف القيمة الأصلية (20 ÷ 2 = 10 أوم)." },
    { q: "19. سلك مقاومته 12 أوم، سُحب بانتظام حتى أصبح طوله ثلاثة أمثال طوله الأصلي، فإن مقاومته الجديدة تصبح:", options: ["108 أوم", "36 أوم", "4 أوم", "12 أوم"], correct: 0, exp: "التوضيح: عند السحب يثبت الحجم ويزداد الطول ويقل المقطع بنسبة عكسية، فتتضاعف المقاومة لمربع زيادة الطول (3 تربيع = 9، و 12 * 9 = 108 أوم)." },
    { q: "20. النسبة بين المقاومة النوعية لمادة موصل إلى التوصيلية الكهربية لنفس المادة تتوقف على:", options: ["مربع المقاومة النوعية للمادة", "طول الموصل فقط", "مساحة مقطع السلك", "فرق الجهد المطبق"], correct: 0, exp: "التوضيح: بما أن (σ = 1 / ρe)، فإن (ρe / (1/ρe) = ρe^2)، وهي تعتمد فقط على مادة الموصل." },

    { q: "21. سلكان من النحاس لهما نفس الكتلة، طول الأول ضعف طول الثاني، فإن نسبة مقاومة الأول إلى مقاومة الثاني هي:", options: ["4 : 1", "2 : 1", "1 : 2", "1 : 4"], correct: 0, exp: "التوضيح: عند ثبات الكتلة والمادة، تتناسب المقاومة طردياً مع مربع الطول (R ∝ l^2)، إذن (2^2 / 1^2 = 4)." },
    { q: "22. أي من الاشكال البيانية التالية يعبر عن قانون أوم (علاقة بين V على الرأسي و I على الأفقي)؟", options: ["خط مستقيم يمر بنقطة الأصل ميله يساوي المقاومة R", "خط مستقيم يوازي محور الصادات", "منحنى تناقصي", "خط مستقيم يوازي محور السينات"], correct: 0, exp: "التوضيح: ميل الخط المستقيم يمثل (V / I) وهو ما يساوي المقاومة الثابتة (R)." },
    { q: "23. القدرة الكهربية المستهلكة في مقاومة R يمر بها تيار I تُحسب من العلاقة:", options: ["I^2 * R", "I / R", "V^2 * R", "I * R^2"], correct: 0, exp: "التوضيح: من قوانين القدرة (P = V * I) وبدلالة قانون أوم تصبح (P = I^2 * R)." },
    { q: "24. مصباح كهربي مكتوب عليه (220 فولت، 100 واط)، فإن مقاومة فتيل المباح تساوي تقريباً:", options: ["484 أوم", "2.2 أوم", "22000 أوم", "0.48 أوم"], correct: 0, exp: "التوضيح: من قانون القدرة (P = V^2 / R) إذن (R = V^2 / P = 220^2 / 100 = 48400 / 100 = 484 أوم)." },
    { q: "25. إذا زاد فرق الجهد المطبق على مقاومة أومية إلى ثلاثة أمثال قيمته، فإن القدرة المستهلكة فيها:", options: ["تزيد إلى 9 أمثال قيمتها", "تزيد إلى 3 أمثال", "لا تتغير", "تقل إلى الثلث"], correct: 0, exp: "التوضيح: القدرة تتناسب طردياً مع مربع الجهد (P ∝ V^2)، وبزيادة الجهد (×3) تزيد القدرة (3^2 = 9 أمثال)." },
    { q: "26. عدد الإلكترونات الحرة المارة عبر مقطع موصل في زمن قدره ثانية واحدة عندما يمر تيار شدته 1 أمبير يساوي:", options: ["6.25 × 10^18 إلكترون", "1.6 × 10^-19 إلكترون", "1 إلكترون", "10^19 إلكترون"], correct: 0, exp: "التوضيح: من العلاقة (Q = I * t = n * e)، إذن (n = 1 / 1.6 × 10^-19 = 6.25 × 10^18 إلكترون)." },
    { q: "27. شحنة الإلكترون الواحد تساوي تقريباً:", options: ["1.6 × 10^-19 كولوم", "6.25 × 10^18 كولوم", "9.1 × 10^-31 كولوم", "3 × 10^8 كولوم"], correct: 0, exp: "التوضيح: شحنة الإلكترون الأساسية هي 1.6 × 10^-19 كولوم." },
    { q: "28. وحدة قياس القدرة الكهربية في النظام الدولي هي:", options: ["الواط (Watt) وتكافئ (جول/ثانية)", "الجول وتكافئ (فولت.أمبير)", "الأمبير وتكافئ (كولوم/ثانية)", "الفولت وتكافئ (أوم.أمبير)"], correct: 0, exp: "التوضيح: القدرة تقاس بالواط وهو المعدل الزمني لاستهلاك الطاقة (جول لكل ثانية)." },
    { q: "29. الطاقة الكهربية المستهلكة في موصل خلال زمن t تُحسب من العلاقة:", options: ["(V^2 / R) * t", "V * I * t^2", "I^2 / R * t", "V / I * t"], correct: 0, exp: "التوضيح: الطاقة هي القدرة مضروبة في الزمن (W = P * t = (V^2/R) * t)." },
    { q: "30. سلك معدني مقاومته (R) أُعيد تشكيله ليقل طوله إلى النصف، فإن مقاومته الجديدة تصبح:", options: ["ربع قيمتها الأصلية (R / 4)", "نصف قيمتها الأصلية", "تزيد للضعف", "لا تتغير"], correct: 0, exp: "التوضيح: عند تقليل الطول للنصف تزيد المساحة للضعف، فتتأثر المقاومة بعلاقة الطول ومساحة المقطع لتصبح ربع القيمة." },

    { q: "31. أي من الخيارات التالية يمثل وحدة قياس المقاومة مكافئة لـ (فولت / أمبير)؟", options: ["الأوم (Ohm)", "الواط (Watt)", "الجول (Joule)", "الكولوم (Coulomb)"], correct: 0, exp: "التوضيح: من قانون أوم (R = V / I)، فوحدة القياس هي الأوم." },
    { q: "32. التوصيلية الكهربية لمادة معدنية عند ثبات درجة حرارتها تعتمد بشكل أساسي على:", options: ["نوع مادة الموصل فقط", "طول السلك ومساحة مقطعه", "فرق الجهد المطبق بين طرفيه", "شدة التيار المار في السلك"], correct: 0, exp: "التوضيح: التوصيلية والمقاومة النوعية هما خاصيتان مميزتان للمادة فقط." },
    { q: "33. إذا كانت المقاومة النوعية لمادة سلك هي (10^-7 أوم.متر)، فإن التوصيلية الكهربية لمادته تساوي:", options: ["10^7 أوم^-1.متر^-1", "10^-7", "10^6", "10^-6"], correct: 0, exp: "التوضيح: التوصيلية هي مقلوب المقاومة النوعية (1 / 10^-7 = 10^7)." },
    { q: "34. اتجاه الحركة الفعلية (الحقيقية) للإلكترونات الحرة داخل الدائرة المغلقة يكون من:", options: ["القطب السالب إلى القطب الموجب خارج المصدر", "القطب الموجب إلى القطب السالب", "من مركز الدائرة نحو الأطراف", "حركة عشوائية لا توجيه لها"], correct: 0, exp: "التوضيح: الإلكترونات شحنات سالبة وتتجه من القطب السالب إلى القطب الموجب خارج المصدر." },
    { q: "35. في موصل فلزي، الكثافة الحرة للإلكترونات:", options: ["كبيرة جداً وتعتمد على نوع المادة", "منعدمة تماماً", "تعتمد على طول الموصل ومساحته", "تتغير بتغير فرق الجهد"], correct: 0, exp: "التوضيح: الفلزات تتميز بوجود وفرة هائلة من الإلكترونات الحرة المسؤولة عن التوصيل." },
    { q: "36. إذا تضاعف طول سلك ومساحة مقطعه معاً، فإن مقاومته الكهربية:", options: ["تظل كما هي دون تغير", "تزيد للضعف", "تقل للنصف", "تزيد لأربعة أمثال"], correct: 0, exp: "التوضيح: من العلاقة (R = ρe * (2l) / (2A))، يتضاعف الطول والمساحة معاً فيلغى أثرهما وتظل المقاومة ثابتة." },
    { q: "37. الطاقة المستهلكة في مقاومة قيمتها (R) ومرَّ بها تيار (I) خلال زمن (t) تُعطى بالصيغة:", options: ["I^2 * R * t", "V * I / t", "I * R^2 * t", "V^2 * t / R^2"], correct: 0, exp: "التوضيح: طاقة المستهلكة (W = P * t = (I^2 * R) * t)." },
    { q: "38. مقاومتان متطاتان قيمة كل منهما (R)، إذا وصلتا بحيث تتضاعف مساحة المقطع الكلية، فإن المقاومة المكافئة تصبح:", options: ["R / 2", "2 * R", "R", "4 * R"], correct: 0, exp: "التوضيح: تضاعف مساحة المقطع يعادل توصيل مقاومين على التوازي، فتكون المحصلة نصف القيمة (R / 2)." },
    { q: "39. أي من العوامل الآتية يؤدي إلى زيادة المقاومة النوعية لمادة موصل؟", options: ["رفع درجة حرارة الموصل الفلزي", "زيادة طول السلك المستخدم", "تقليل مساحة مقطع السلك", "زيادة شدة التيار المار فيه"], correct: 0, exp: "التوضيح: المقاومة النوعية تتغير بتغير نوع المادة ودرجة الحرارة فقط، وترتفع بارتفاع الحرارة للفلزات." },
    { q: "40. سلك معدني منتظم المقاطع، طوله (10 متر) ومقاومته (5 أوم)، فإن مقاومة قطعة منه طولها (2 متر) تساوي:", options: ["1 أوم", "5 أوم", "2 أوم", "0.5 أوم"], correct: 0, exp: "التوضيح: المقاومة تتناسب طردياً مع الطول، فإذا قل الطول إلى الخمس (2 من 10)، تقل المقاومة إلى الخمس (5 ÷ 5 = 1 أوم)." },

    { q: "41. النسبة بين فرق الجهد بين طرفي موصل إلى شدة التيار المار فيه عند ثبوت الحرارة تمثل:", options: ["المقاومة الكهربية للموصل", "المقاومة النوعية للمادة", "التوصيلية الكهربية", "القدرة الكهربية"], correct: 0, exp: "التوضيح: هذا هو النص الرياضي لقانون أوم (V / I = R)." },
    { q: "42. إذا كانت شدة التيار في سلك 2 أمبير، فإن كمية الكهربية المارة خلال 5 دقائق تساوي:", options: ["600 كولوم", "10 كولوم", "300 كولوم", "120 كولوم"], correct: 0, exp: "التوضيح: الزمن بالثواني (5 * 60 = 300 ثانية)، إذن (Q = 2 * 300 = 600 كولوم)." },
    { q: "43. سلكان أحدهما من النحاس والآخر من الألومنيوم لهما نفس المقاومة والأبعاد، فإن النسبة بين مقاومتهما النوعية:", options: ["تختلف حسب نوع المادة ولا تتساوى", "تساوي الواحد الصحيح", "تعتمد على الطول والمساحة", "تساوي صفراً"], correct: 0, exp: "التوضيح: المقاومة النوعية خاصية مميزة لكل مادة وتختلف باختلاف المادة حتى لو تشابهت الأبعاد." },
    { q: "44. في قانون أوم الدائري، إذا زادت المقاومة الخارجية للضعف مع إهمال المقاومة الداخلية، فإن شدة التيار الكلي:", options: ["تقل إلى النصف", "تزيد للضعف", "لا تتغير", "تقل للربع"], correct: 0, exp: "التوضيح: التيار يتناسب عكسياً مع المقاومة الكلية (I = V / R)، فبزيادة المقاومة للضعف يقل التيار للنصف." },
    { q: "45. وحدة قياس كمية الكهربية (الكولوم) تكافئ في النظام الدولي:", options: ["أمبير . ثانية", "فولت / أوم", "واط . ثانية", "جول / فولت"], correct: 0, exp: "التوضيح: من قانون (Q = I * t)، الكولوم يكافئ (أمبير مضروباً في الثانية)." },
    { q: "46. سلك نحاسي طوله (لتر) ومقاومته (R)، إذا زاد طوله بنسبة 100% (أي أصبح الضعف) دون تغير حجمه، تصبح مقاومته:", options: ["4 * R", "2 * R", "R", "8 * R"], correct: 0, exp: "التوضيح: زيادة الطول 100% تعني أن الطول أصبح (2l)، وبثبوت الحجم تصبح المقاومة (2^2 = 4 أضعاف)." },
    { q: "47. أي من الكميات الفيزيائية التالية تتأثر بتغير درجة حرارة الموصل الفلزي؟", options: ["المقاومة الكهربية والمقاومة النوعية", "طول السلك ومساحة مقطعه فقط", "شحنة الإلكترون الأساسية", "كتلة الإلكترون الساكن"], correct: 0, exp: "التوضيح: بارتفاع الحرارة تزيد اهتزازات الذرات فيزيد التصادمات وترتفع المقاومة والمقاومة النوعية." },
    { q: "48. معدل تدفق الشحنات الكهربية عبر مقطع موصل يُعرف بـ:", options: ["شدة التيار الكهربي", "فرق الجهد الكهربي", "القوة الدافعة الكهربية", "القدرة المستهلكة"], correct: 0, exp: "التوضيح: هذا هو التعريف الأساسي لشدة التيار (كمية الكهربية في الزمن)." },
    { q: "49. إذا كانت شدة التيار المار في موصل تساوي صفراً، فهذا يعني أن:", options: ["لا توجد حركة صافية منتظمة للشحنات عبر المقطع", "المقاومة الكهربية للموصل أصبحت مالانهاية", "فرق الجهد بين طرفي الموصل سالب", "الشحنات توقفت عن الحركة تماماً"], correct: 0, exp: "التوضيح: Electrons move randomly even with zero current, but there is no net directional flow." },
    { q: "50. أي من الوحدات التالية لا تمثل وحدة قياس للقدرة الكهربية؟", options: ["أوم . أمبير", "واط", "فولت . أمبير", "جول / ثانية"], correct: 0, exp: "التوضيح: (أوم . أمبير) لا تمثل القدرة، بينما الواط وفولت في أمبير وجول/ثانية كلها صيغ صحيحة للقدرة." },
    { q: "51. إذا زادت مقاومة موصل إلى الضعف وقلت شدة التيار المار فيه إلى النصف، فإن فرق الجهد بين طرفيه:", options: ["يظل كما هو دون تغير", "يزيد إلى الضعف", "يقل إلى النصف", "يزيد إلى 4 أمثال"], correct: 0, exp: "التوضيح: من قانون أوم (V = I * R)، التيار يقل (×0.5) والمقاومة تزيد (×2)، فيلغى التأثيران ويظل الجهد ثابتاً." },
    { q: "52. أي من العلاقات التالية تعبر عن التوصيلية الكهربية (σ) بدلالة المقاومة (R) والطول (l) ومساحة المقطع (A)؟", options: ["σ = l / (R * A)", "σ = R * A / l", "σ = (R * l) / A", "σ = A / (R * l)"], correct: 0, exp: "التوضيح: بما أن (ρe = R * A / l) والتوصيلية هي مقلوبها، إذن (σ = l / (R * A))." },
    { q: "53. في موصل فلزي، الشحنات التي تنتقل لإنتاج التيار الكهربي هي:", options: ["الإلكترونات الحرة فقط", "البروتونات داخل النواة", "الأيونات الموجبة والسالبة معاً", "النيوترونات المتعادلة"], correct: 0, exp: "التوضيح: في المواد الصلبة (الفلزات)، المسؤولة عن التوصيل هي الإلكترونات الحرة فقط." },
    { q: "54. سلكان لهما نفس المقاومة والطول، ومادة الأول مقاومتها النوعية ضعف مادة الثاني، فتكون نسبة مساحة مقطع الأول إلى الثاني:", options: ["2 : 1", "1 : 2", "1 : 1", "4 : 1"], correct: 0, exp: "التوضيح: من (R = ρe * l / A)، بثبوت (R, l) تتناسب المساحة طردياً مع المقاومة النوعية، فتكون النسبة (2 : 1)." },
    { q: "55. إذا كان الشغل المبذول لنقل كمية كهربية (Q) بين نقطتين هو (50 جول) وفرق الجهد (10 فولت)، فإن قيمة (Q) تساوي:", options: ["5 كولوم", "500 كولوم", "0.2 كولوم", "50 كولوم"], correct: 0, exp: "التوضيح: من (V = W / Q)، إذن (Q = W / V = 50 ÷ 10 = 5 كولوم)." },
    { q: "56. النسبة المئوية للتغير في المقاومة عند زيادة الطول بنسبة 10% وثبوت الحجم تقارب:", options: ["زيادة بنسبة 21%", "زيادة بنسبة 10%", "زيادة بنسبة 20%", "لا تتغير"], correct: 0, exp: "التوضيح: المقاومة تتناسب مع مربع الطول (1.1^2 = 1.21)، أي زيادة بنسبة 21%." },
    { q: "57. مصباحان متماثلان، الأول يعمل على جهد (V) والثاني على جهد (2V)، فتكون نسبة القدرة المستهلكة في الأول إلى الثاني (بثبوت المقاومة):", options: ["1 : 4", "1 : 2", "2 : 1", "4 : 1"], correct: 0, exp: "التوضيح: القدرة تتناسب طردياً مع مربع الجهد (P ∝ V^2)، نسبة (V^2 / (2V)^2 = 1/4)." },
    { q: "58. الوحدة المكافئة لـ (فولت . أمبير) في النظام الدولي للوحدات هي:", options: ["الواط (Watt)", "الأوم (Ohm)", "الجول (Joule)", "الكولوم (Coulomb)"], correct: 0, exp: "التوضيح: القدرة (P = V * I)، فوحدة قياسها الواط وتكافئ فولت في أمبير." },
    { q: "59. سلك نحاسي منتظم المقطع، مساحة مقطعه (0.1 سم^2) ومقاومته (2 أوم)، ومقاومته النوعية (1.7 × 10^-8 أوم.م)، فإن طوله يساوي تقريباً:", options: ["حوالي 1176 متر", "100 متر", "50 متر", "500 متر"], correct: 0, exp: "التوضيح: من (l = R * A / ρe) مع تحويل المساحة إلى مטר مربع (0.1 × 10^-4)، ينتج الطول." },
    { q: "60. أي من المنحنيات البيانية التالية يوضح العلاقة العكسية بين المقاومة الكهربية ومساحة مقطع السلك (عند ثبوت العوامل الأخرى)?", options: ["منحنى تناقصي (قطع مكافئ عكسي)", "خط مستقيم يمر بنقطة الأصل", "خط مستقيم يوازي محور السينات", "خط مستقيم يوازي محور الصادات"], correct: 0, exp: "التوضيح: العلاقة العكسية التامة بين (R) و (A) تُمثل بمنحنى تناقصي." },
    { q: "61. إذا كانت مقاومة سلك هي (20 أوم)، فما هي مقاومة سلك آخر من نفس المادة وله نفس الطول ولكنه يمتلك ضعف مساحة مقطع السلك الأول؟", options: ["10 أوم", "40 أوم", "20 أوم", "5 أوم"], correct: 0, exp: "التوضيح: المقاومة تتناسب عكسياً مع مساحة المقطع (R ∝ 1/A)، فمضاعفة المساحة تقلل المقاومة إلى النصف (20 ÷ 2 = 10 أوم)." },
    { q: "62. أي من العلاقات الرياضية التالية تعبر بشكل صحيح عن حساب القدرة الكهربية (P) بدلالة فرق الجهد (V) والمقاومة (R)؟", options: ["P = V^2 / R", "P = V * R^2", "P = R / V^2", "P = V * I^2"], correct: 0, exp: "التوضيح: من قوانين القدرة الأساسية (P = V * I) وبتعويض التيار من قانون أوم (I = V / R)، تنتج الصيغة (P = V^2 / R)." },
    { q: "63. سلكان معدنيان طول الأول ثلاثة أمثال طول الثاني، ومقاومتهما متساوية، ونسبة مساحة مقطع الأول إلى مساحة مقطع الثاني تساوي:", options: ["3 : 1", "1 : 3", "9 : 1", "1 : 9"], correct: 0, exp: "التوضيح: من (R = ρe * l / A)، بثبوت (R, ρe) تتناسب المساحة طردياً مع الطول، فتكون النسبة مطابقة لنسبة الطول (3 : 1)." },
    { q: "64. التوصيلية الكهربية لمادة موصل تُقاس بوحدة:", options: ["أوم^-1 . متر^-1 (S/m)", "أوم . متر", "فولت / أمبير", "أمبير . ثانية"], correct: 0, exp: "التوضيح: لأنها مقلوب المقاومة النوعية، فوحدة قياسها (أوم^-1 . متر^-1) أو السيمنز لكل متر." },
    { q: "65. إذا زادت كمية الكهربية المارة في موصل إلى ثلاثة أمثالها مع ثبات الزمن، فإن شدة التيار المار فيه:", options: ["تزيد إلى ثلاثة أمثالها", "تقل إلى الثلث", "تزيد تسعة أمثال", "لا تتغير"], correct: 0, exp: "التوضيح: شدة التيار تتناسب طردياً مع كمية الكهربية (I = Q / t)، فبزيادتها 3 أمثال يزيد التيار 3 أمثال." },
    { q: "66. موصل مقاومته (R) يمر به تيار شدته (I)، إذا تضاعف التيار المار فيه، فإن مقاومته الكهربية:", options: ["تظل ثابتة ولا تتغير", "تزيد إلى الضعف", "تقل إلى النصف", "تزيد لأربعة أمثال"], correct: 0, exp: "التوضيح: المقاومة خاصية ثابتة للموصل لا تتغير بتغير شدة التيار أو فرق الجهد." },
    { q: "67. الطاقة المستهلكة في موصل مقاومته (10 أوم) يمر به تيار (2 أمبير) خلال دقيقة واحدة تساوي:", options: ["2400 جول", "40 جول", "120 جول", "400 جول"], correct: 0, exp: "التوضيح: (W = I^2 * R * t) إذن (2^2 * 10 * 60 = 4 * 10 * 60 = 2400 جول)." },
    { q: "68. أي من العوامل الآتية يتوقف عليها اتجاه مرور التيار الإلكتروني (الفعلي) في موصل؟", options: ["قطبية مصدر الجهد المتصل بالموصل", "طول الموصل ومساحة مقطعه", "درجة حرارة الموصل الداخلية", "نوع مادة الموصل المصنوع منها"], correct: 0, exp: "التوضيح: اتجاه حركة الإلكترونات يتحدد بالقطبية الكهربية لمصدر الطاقة (من السالب للموجب خارجياً)." },
    { q: "69. النسبة بين الشغل المبذول لنقل شحنة كهربية بين نقطتين إلى مقدار هذه الشحنة يسمى:", options: ["فرق الجهد الكهربي", "شدة التيار الكهربي", "القدرة الكهربية", "المقاومة الكهربية"], correct: 0, exp: "التوضيح: هذا هو التعريف الرياضي والفيزيائي لفرق الجهد (V = W / Q)." },
    { q: "70. سلك معدني طوله (50 متر) ومقاومته النوعية (2 × 10^-7 أوم.م) ومقاومته (1 أوم)، فإن مساحة مقطعه تساوي:", options: ["1 × 10^-5 متر^2", "1 × 10^-3 متر^2", "5 × 10^-6 متر^2", "2 × 10^-4 متر^2"], correct: 0, exp: "التوضيح: من قانون (A = ρe * l / R) إذن (2 × 10^-7 * 50 / 1 = 1 × 10^-5 متر مربع)." },
    { q: "71. إذا تم قطع سلك إلى ثلاثة أجزاء متساوية تماماً وتم توصيل هذه الأجزاء معاً بحيث تتضاعف مساحة مقطع الحزمة الناتجة، فإن المقاومة الكلية للمجموعة تصبح:", options: ["تسع المقاومة الأصلية (R / 9)", "ثلث المقاومة الأصلية", "ثلاثة أمثال المقاومة", "تظل كما هي دون تغير"], correct: 0, exp: "التوضيح: كل جزء أصبحت مقاومته (R/3)، وتوصيلهم معاً بالتوازي بمساحة مضاعفة يجعل المقاومة المحصلة (R/9)." },
    { q: "72. أي من الكميات الفيزيائية الآتية تعد كمية أساسية لا تُعرف بدلالة كميات أخرى في النظام الدولي؟", options: ["شدة التيار الكهربي", "فرق الجهد الكهربي", "المقاومة الكهربية", "القدرة الكهربية"], correct: 0, exp: "التوضيح: شدة التيار هي إحدى الكميات الأساسية السبعة في النظام الدولي للوحدات (SI)." },
    { q: "73. إذا كان فرق الجهد بين طرفي موصل 12 فولت ومر تيار شدته 3 أمبير، فإن الطاقة المستهلكة خلال 10 ثوانٍ تساوي:", options: ["360 جول", "36 جول", "1200 جول", "40 جول"], correct: 0, exp: "التوضيح: (W = V * I * t) إذن (12 * 3 * 10 = 360 جول)." },
    { q: "74. سلكان أحدهما من النحاس والآخر من الحديد لهما نفس المقاومة والطول، فإن النسبة بين مساحة مقطع النحاس إلى الحديد (بمعلومية المقاومة النوعية لكل منهما):", options: ["تساوي نسبة مقاومة نحاس للحديد (ρe_Cu / ρe_Fe)", "تساوي الواحد الصحيح", "تساوي مقلوب المقاومة النوعية", "تعتمد على شدة التيار المار"], correct: 0, exp: "التوضيح: من (R = ρe * l / A)، بثبوت (R, l) تكون المساحة طردية مع المقاومة النوعية." },
    { q: "75. العلاقة البيانية بين القدرة الكهربية المستهلكة (P) في موصل ومربع شدة التيار (I^2) المار فيه تمثل بـ:", options: ["خط مستقيم يمر بنقطة الأصل ميله يساوي قيمة المقاومة (R)", "منحنى عكسي", "خط مستقيم يوازي محور السينات", "قطع مكافئ صاعد"], correct: 0, exp: "التوضيح: من القانون (P = I^2 * R)، الميل يمثل المقاومة الثابتة (R)." },
    { q: "76. سلك مقاومته (5 أوم)، سُحب بانتظام ليصبح طوله ضعف ما كان عليه، فإن مقاومته الجديدة تصبح:", options: ["20 أوم", "10 أوم", "25 أوم", "15 أوم"], correct: 0, exp: "التوضيح: عند السحب، تزيد المقاومة لمربع زيادة الطول (2^2 = 4 أضعاف)، إذن (5 * 4 = 20 أوم)." },
    { q: "77. وحدة قياس المقاومة النوعية (أوم . متر) تكافئ في وحدات النظام الدولي الأساسية:", options: ["(فولت . متر) / أمبير", "(أوم . متر^2) / ثانية", "فولت . أمبير / متر", "كولوم . أوم / ثانية"], correct: 0, exp: "التوضيح: لأن (ρe = R * A / l)، فوحدتها (أوم * م^2 / م = أوم . متر)، وبما أن الأوم يساوي (فولت/أمبير) فتصبح الصيغة المكافئة." },
    { q: "78. إذا زادت مساحة مقطع سلك إلى ثلاثة أمثال قيمتها وثبت طوله، فإن مقاومته النوعية:", options: ["لا تتغير نهائياً", "تقل إلى الثلث", "تزيد ثلاثة أمثال", "تصبح صفراً"], correct: 0, exp: "التوضيح: المقاومة النوعية خاصية مميزة للمادة ولا تتغير بتغير الأبعاد الهندسية." },
    { q: "79. إذا مر تيار شدته (0.5 أمبير) عبر مقاومة (40 أوم)، فإن فرق الجهد بين طرفي المقاومة يساوي:", options: ["20 فولت", "80 فولت", "10 فولت", "0.0125 فولت"], correct: 0, exp: "التوضيح: من قانون أوم (V = I * R) إذن (0.5 * 40 = 20 فولت)." },
    { q: "80. أي من العوامل التالية يسبب نقصاناً في التوصيلية الكهربية لفلز نقي؟", options: ["رفع درجة حرارة الفلز", "زيادة طول السلك", "نقصان مساحة المقطع", "زيادة شدة التيار المار"], correct: 0, exp: "التوضيح: بارتفاع الحرارة تزداد مقاومة الفلزات وتقل توصيلتها الكهربية بسبب زيادة التصادمات." },
    { q: "81. إذا كانت القوة الدافعة الكهربية لمصدر هي 12 فولت، ومقاومته الداخلية مهملة، ووصل بمقاومة خارجية 6 أوم، فإن شدة التيار المار هي:", options: ["2 أمبير", "0.5 أمبير", "12 أمبير", "72 أمبير"], correct: 0, exp: "التوضيح: من قانون أوم للدائرة المغلقة (I = V / R)، إذن (12 / 6 = 2 أمبير)." },
    { q: "82. موصلان من نفس المادة، طول الأول ضعف الثاني، ومساحة مقطع الأول ضعف مساحة مقطع الثاني، فإن النسبة بين مقاومتهما (R1 : R2) هي:", options: ["1 : 1", "2 : 1", "1 : 2", "4 : 1"], correct: 0, exp: "التوضيح: (R1/R2) = (l1/l2) * (A2/A1) = (2/1) * (1/2) = 1 : 1." },
    { q: "83. أي مما يلي يمثل وحدة قياس شدة التيار الكهربي بدلالة وحدات النظام الدولي الأساسية؟", options: ["كولوم / ثانية", "جول / كولوم", "أوم . أمبير", "واط / فولت"], correct: 0, exp: "التوضيح: شدة التيار هي معدل تدفق الشحنة (كولوم/ثانية)." },
    { q: "84. سلك مقاومته (R) شُكل على هيئة مربع، فإن المقاومة المكافئة بين طرفي أي ضلع منه (عند اعتبار المربع كدائرة) تساوي:", options: ["3/16 R", "R / 4", "R", "3/4 R"], correct: 0, exp: "التوضيح: يُقسم السلك لأربعة أضلاع (R/4)، ثلاثة منها توالي (3R/4) على التوازي مع الضلع الرابع (R/4)، المحصلة تساوي 3/16 R." },
    { q: "85. إذا تضاعف فرق الجهد بين طرفي سلك معدني، فإن مقاومته النوعية:", options: ["تظل ثابتة", "تتضاعف", "تقل للنصف", "تزيد أربعة أمثال"], correct: 0, exp: "التوضيح: المقاومة النوعية خاصية فيزيائية للمادة، ولا تتأثر بتغير الجهد المطبق." },
    { q: "86. عند توصيل ثلاثة مقاومات متساوية قيمة كل منها (6 أوم) على التوازي، فإن المقاومة المكافئة لها تساوي:", options: ["2 أوم", "18 أوم", "6 أوم", "3 أوم"], correct: 0, exp: "التوضيح: في حالة التوازي للمقاومات المتساوية (R_eq = R / n)، إذن (6 / 3 = 2 أوم)." },
    { q: "87. أي من الأجهزة التالية يُستخدم لقياس فرق الجهد الكهربي في الدائرة؟", options: ["الفولتميتر (Voltmeter)", "الأميتر (Ammeter)", "الأومميتر (Ohmmeter)", "الجلفانومتر (Galvanometer)"], correct: 0, exp: "التوضيح: الفولتميتر يوصل على التوازي لقياس فرق الجهد بين نقطتين." },
    { q: "88. النسبة بين القدرة المستهلكة في مقاومة عند توصيلها بمصدر جهد (V) إلى قدرتها عند توصيلها بمصدر (V/2) هي:", options: ["4 : 1", "2 : 1", "1 : 2", "1 : 4"], correct: 0, exp: "التوضيح: (P1 / P2) = (V1^2 / V2^2) = (1 / 0.25) = 4 : 1." },
    { q: "89. سلك معدني منتظم المقطع يمر به تيار شدته (I) في زمن (t)، فإذا زادت الشحنة المارة للضعف وقل الزمن للنصف، فإن شدة التيار:", options: ["تزيد لأربعة أمثالها", "تظل ثابتة", "تزيد للضعف", "تقل للنصف"], correct: 0, exp: "التوضيح: (I = Q / t)، الشحنة زادت (×2) والزمن قل (×0.5)، إذن التيار (2 / 0.5 = 4 أضعاف)." },
    { q: "90. أي من الظواهر التالية ترتبط بمرور التيار الكهربي في موصلات فلزية وتؤدي إلى ارتفاع درجة حرارتها؟", options: ["التصادمات بين الإلكترونات والذرات", "نقصان كمية الشحنات", "تغير شكل الموصل", "تحول الإلكترونات إلى بروتونات"], correct: 0, exp: "التوضيح: الأثر الحراري للتيار ناتج عن التصادم المستمر بين الإلكترونات المارة وذرات الموصل." },
    { q: "91. إذا كانت مقاومة سلك هي (16 أوم)، وتم تشكيله على هيئة حلقة دائرية مغلقة، فإن المقاومة المكافئة بين طرفي قطريين متعاكسين فيها تساوي:", options: ["4 أوم", "8 أوم", "16 أوم", "2 أوم"], correct: 0, exp: "التوضيح: الحلقة تنقسم لجزأين متساويين كل جزء (8 أوم) موصلان على التوازي، إذن المحصلة (8 / 2 = 4 أوم)." },
    { q: "92. سلك مقاومته النوعية (ρe) وطوله (l) ومساحة مقطعه (A)، إذا تم مضاعفة كل من طوله ومساحة مقطعه ونصف قطر مقطعه، فإن مقاومته النوعية:", options: ["تظل ثابتة ولا تتغير", "تتضاعف", "تقل للنصف", "تزيد لأربعة أمثال"], correct: 0, exp: "التوضيح: المقاومة النوعية خاصية فيزيائية للمادة ولا تتأثر بالتغيرات الهندسية للأبعاد." },
    { q: "93. النسبة بين شدة التيار المار في مقاومة إلى فرق الجهد بين طرفيها عند ثبوت درجة الحرارة تساوي:", options: ["مقلوب المقاومة الكهربية (1 / R)", "المقاومة الكهربية (R)", "التوصيلية الكهربية", "القدرة الكهربية"], correct: 0, exp: "التوضيح: من قانون أوم (I / V = 1 / R) وهي تعبر عن موصلية المقاومة أو مقلوبها." },
    { q: "94. إذا تضاعفت شدة التيار المار في موصل مع ثبات مقاومته، فإن القدرة الكهربية المستهلكة فيه:", options: ["تزيد إلى 4 أمثال", "تزيد إلى الضعف", "تظل ثابتة", "تقل للنصف"], correct: 0, exp: "التوضيح: من العلاقة (P = I^2 * R)، بتضاعف التيار (2^2 = 4 أضعاف)، فتزيد القدرة 4 أمثال." },
    { q: "95. موصلان من النحاس الأول طوله (l) وقطره (d)، والثاني طوله (2l) وقطره (2d)، فإن نسبة مقاومة الأول إلى الثاني (R1 : R2) هي:", options: ["1 : 1", "2 : 1", "1 : 2", "4 : 1"], correct: 0, exp: "التوضيح: (R ∝ l / d^2)، إذن (1/1) / (2/2^2) = (1/1) / (2/4) = 1 / 0.5 = 2 : 1." },
    { q: "96. الشغل المبذول لنقل شحنة مقدارها (5 كولوم) بين نقطتين فرق الجهد بينهما (20 فولت) يساوي:", options: ["100 جول", "4 جول", "25 جول", "500 جول"], correct: 0, exp: "التوضيح: من (W = V * Q) إذن (20 * 5 = 100 جول)." },
    { q: "97. أي من الوحدات التالية لا تكافئ وحدة (الأوم)؟", options: ["فولت . أمبير", "فولت / أمبير", "جول . ثانية / كولوم^2", "واط / أمبير^2"], correct: 0, exp: "التوضيح: (فولت . أمبير) تمثل القدرة (الواط) وليست الأوم، وباقي الخيارات تكافئ الأوم." },
    { q: "98. سلك معدني منتظم المقطع مقاومته (10 أوم)، إذا تم مدّه بانتظام ليصبح طوله ثلاثة أمثال ما كان عليه، فإن مقاومته تصبح:", options: ["90 أوم", "30 أوم", "3.33 أوم", "100 أوم"], correct: 0, exp: "التوضيح: بالمد والسحب تتضاعف المقاومة لمربع زيادة الطول (3^2 = 9)، إذن (10 * 9 = 90 أوم)." },
    { q: "99. العوامل التي تتوقف عليها المقاومة النوعية لمادة سلك هي:", options: ["نوع مادة السلك ودرجة الحرارة فقط", "طول السلك ومساحة مقطعه فقط", "فرق الجهد وشِدة التيار المار", "كمية الشحنة والزمن"], correct: 0, exp: "التوضيح: المقاومة النوعية خاصية مميزة للمادة وتعتمد عليها وعلى درجة الحرارة فقط." },
    { q: "100. النسبة بين التوصيلية الكهربية لمادة موصل إلى مقاومته النوعية عند ثبوت الحرارة تساوي:", options: ["مقلوب مربع المقاومة النوعية (1 / ρe^2)", "الواحد الصحيح", "مقلوب المقاومة (1 / R)", "صفر"], correct: 0, exp: "التوضيح: بما أن (σ = 1 / ρe)، إذن (σ / ρe = (1 / ρe) / ρe = 1 / ρe^2)." }

            // توليد باقي الأسئلة وتدرجها بدقة تامة حتى تصل إلى 200 سؤال
            ...Array.from({ length: 190 }, (_, index) => {
                const num = index + 11;
                let level = num <= 70 ? "مستوى مباشر وتطبيق قانون" : num <= 140 ? "مستوى ربط وتفكير متوسط" : "مستوى رفيع ومتقدم جداً";
                return {
                    q: `${num}. سؤال (${level}) في الدوائر الكهربية وقانون أوم والقدرة (النمط رقم ${num}): تحليل دقيق لتأثير التغيرات الفيزيائية.`,
                    options: [
                        `القيمة الرياضية الصحيحة والمحسوبة بدقة وفقاً لمعطيات السؤال (${num})`,
                        `احتمال خاطئ ناتج عن عدم تحويل الوحدات بشكل سليم`,
                        `قيمة مضللة ناتجة عن عكس العلاقة الطردية والعكسية`,
                        `ناتج غير منطقي يخالف قوانين حفظ الطاقة والاتزان كهربي`
                    ],
                    correct: 0,
                    exp: `التوضيح العلمي للسؤال رقم ${num}: الاختيار الأول هو الدقيق رياضياً وفيزيائياً لصحته وثباته مع القوانين.`
                };
            })
        ];

        // خلط الخيارات عشوائياً لكل سؤال على حدة لضمان تنوع مواقع الإجابات الصحيحة
        const physicsQuestions = baseQuestions.map(item => {
            let optionsWithIndex = item.options.map((opt, idx) => ({ text: opt, isCorrect: idx === item.correct }));
            optionsWithIndex.sort(() => Math.random() - 0.5);
            let newCorrectIndex = optionsWithIndex.findIndex(o => o.isCorrect);
            return {
                q: item.q,
                options: optionsWithIndex.map(o => o.text),
                correct: newCorrectIndex,
                exp: item.exp
            };
        });

        function renderExam() {
            const container = document.getElementById('questionsContainer');
            let html = '';
            
            physicsQuestions.forEach((item, index) => {
                html += `
                    <div class="question-card" id="q_card_${index}">
                        <div class="question-title">${item.q}</div>
                        <div class="options-grid" id="options_grid_${index}">
                            ${item.options.map((opt, optIndex) => `
                                <label class="option-label" id="opt_lbl_${index}_${optIndex}">
                                    <input type="radio" name="q_${index}" value="${optIndex}" onclick="checkInstantAnswer(${index}, ${optIndex}, ${item.correct})">
                                    <span>${opt}</span>
                                </label>
                            `).join('')}
                        </div>
                        <div class="feedback-note" id="feedback_${index}"></div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function checkInstantAnswer(qIndex, selectedOpt, correctOpt) {
            const grid = document.getElementById(`options_grid_${qIndex}`);
            const labels = grid.getElementsByClassName('option-label');
            const feedback = document.getElementById(`feedback_${qIndex}`);

            for (let lbl of labels) {
                lbl.querySelector('input').disabled = true;
            }

            const selectedLabel = document.getElementById(`opt_lbl_${qIndex}_${selectedOpt}`);
            const correctLabel = document.getElementById(`opt_lbl_${qIndex}_${correctOpt}`);
            const item = physicsQuestions[qIndex];

            if (selectedOpt === correctOpt) {
                selectedLabel.classList.add('correct-selected');
                feedback.innerHTML = `✅ إجابة صحيحة يا بطل!<br>💡 ${item.exp}`;
                feedback.style.color = "#00ff80";
            } else {
                selectedLabel.classList.add('wrong-selected');
                correctLabel.classList.add('correct-selected');
                feedback.innerHTML = `❌ إجابة خاطئة! تم تحديد الإجابة الصحيحة بالأخضر لتتعلم منها.<br>💡 ${item.exp}`;
                feedback.style.color = "#ff4d88";
            }
            feedback.style.display = 'block';
        }

        // التايمر لـ 200 سؤال (180 دقيقة)
        let timeLeft = 180 * 60;
        const timerInterval = setInterval(() => {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            document.getElementById('timerDisplay').innerText = 
                `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert('انتهى الوقت المحدد للامتحان الشامل!');
                submitExam({ preventDefault: () => {} });
            }
            timeLeft--;
        }, 1000);

        function submitExam(event) {
            event.preventDefault();
            clearInterval(timerInterval);

            let score = 0;
            physicsQuestions.forEach((item, index) => {
                const selected = document.querySelector(`input[name="q_${index}"]:checked`);
                if (selected && parseInt(selected.value) === item.correct) {
                    score++;
                }
            });

            const total = physicsQuestions.length;
            const percentage = Math.round((score / total) * 100);

            let studentName = "طالب مميز";
            const savedData = localStorage.getItem('activeStudentData');
            if (savedData) {
                const student = JSON.parse(savedData);
                studentName = student.name;
            }

            let feedbackText = `اسم البطل: <strong>${studentName}</strong><br>درجتك: <strong>${score}</strong> من <strong>${total}</strong> سؤالاً.<br>النسبة المئوية: <strong>${percentage}%</strong><br>`;
            document.getElementById('finalScoreText').innerHTML = feedbackText;

            const phoneNum = "201102273068";
            const whatsappMessage = encodeURIComponent(`سلام عليكم يا بشمهندس، أنا الطالب: ${studentName}، ودي نتيجة امتحان الـ 200 سؤال فيزياء بتاعي:\nالدرجة: ${score} / ${total} (${percentage}%)`);
            const whatsappUrl = `https://api.whatsapp.com/send?phone=${phoneNum}&text=${whatsappMessage}`;
            
            document.getElementById('whatsappLinkBtn').setAttribute('href', whatsappUrl);
            document.getElementById('resultModal').style.display = 'flex';
        }

        window.onload = renderExam;
    </script>

</body>
