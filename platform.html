<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الرئيسية - Quantum Physics Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: #030005;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .quantum-bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(255, 0, 119, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(0, 242, 254, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 204, 0, 0.1) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        .physics-floating-formula {
            position: absolute;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            opacity: 0.18;
            animation: quantumFloat 20s infinite linear;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes quantumFloat {
            0% { transform: translateY(115vh) translateX(-50px) rotate(0deg) scale(0.9); }
            50% { transform: translateY(50vh) translateX(50px) rotate(180deg) scale(1.1); }
            100% { transform: translateY(-150px) translateX(-30px) rotate(360deg) scale(0.9); }
        }

        /* زر القائمة (الثلاث شطات) في الزاوية */
        .menu-toggle-btn {
            position: fixed;
            top: 25px;
            right: 25px;
            background: rgba(20, 10, 35, 0.8);
            border: 2px solid #00f2fe;
            color: #00f2fe;
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 0 15px rgba(0,242,254,0.3);
            transition: 0.3s;
        }
        .menu-toggle-btn:hover {
            background: #00f2fe;
            color: #030005;
        }

        /* القائمة الجانبية المنسدلة */
        .side-drawer {
            position: fixed;
            top: 0;
            right: -320px;
            width: 320px;
            height: 100%;
            background: #0d0614;
            border-left: 2px solid #3b1f4e;
            box-shadow: -10px 0 40px rgba(0,0,0,0.8);
            z-index: 200;
            transition: 0.4s ease-in-out;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .side-drawer.open {
            right: 0;
        }
        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #221235;
            padding-bottom: 15px;
        }
        .drawer-header h3 { color: #00f2fe; font-size: 18px; }
        .close-drawer { background: none; border: none; color: #ff0077; font-size: 22px; cursor: pointer; }

        .drawer-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .drawer-group label { font-size: 13px; color: #94a3b8; font-weight: bold; }
        .drawer-input {
            background: #140a23;
            border: 1px solid #3b1f4e;
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            font-size: 14px;
        }
        .drawer-input:focus { outline: none; border-color: #00f2fe; }
        .drawer-btn {
            background: linear-gradient(135deg, #ff0077, #00f2fe);
            border: none;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .drawer-btn:hover { opacity: 0.9; }

        .elite-glow-badge {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, rgba(255, 0, 119, 0.2), rgba(0, 242, 254, 0.2), rgba(255, 204, 0, 0.2));
            border: 2px solid rgba(0, 242, 254, 0.6);
            border-radius: 40px;
            padding: 10px 30px;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #00f2fe;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.4), inset 0 0 15px rgba(255, 0, 119, 0.3);
            z-index: 20;
            text-align: center;
        }

        .platform-quantum-card {
            position: relative;
            z-index: 10;
            background: rgba(10, 5, 18, 0.92);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 3px solid transparent;
            background-image: linear-gradient(rgba(10, 5, 18, 0.95), rgba(10, 5, 18, 0.95)), 
                              linear-gradient(135deg, #ff0077, #00f2fe, #ffcc00);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            border-radius: 50px;
            box-shadow: 0 70px 140px rgba(0, 0, 0, 0.95), 
                        0 0 60px rgba(255, 0, 119, 0.3), 
                        0 0 60px rgba(0, 242, 254, 0.3);
            width: 100%;
            max-width: 700px;
            padding: 45px;
            text-align: center;
            margin: 90px 20px 30px 20px;
        }

        .student-profile-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .student-avatar-frame {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #00f2fe;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.5), 0 0 15px rgba(255, 0, 119, 0.4);
            margin-bottom: 12px;
            background: #020617;
        }

        .student-avatar-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%;
            display: block;
        }

        .eng-title-elite {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff0077, #ffcc00, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        
        .welcome-user-box {
            font-size: 17px;
            color: #00f2fe;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .quantum-action-btn {
            background: rgba(20, 10, 35, 0.9);
            border: 2px solid #3b1f4e;
            border-radius: 22px;
            padding: 24px 20px;
            color: #fff;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .quantum-action-btn span.icon { font-size: 32px; }

        .quantum-action-btn.lectures {
            border-color: rgba(255, 0, 119, 0.6);
            background: linear-gradient(135deg, rgba(255, 0, 119, 0.15), rgba(20, 10, 35, 0.9));
        }
        .quantum-action-btn.lectures:hover { border-color: #ff0077; box-shadow: 0 0 35px rgba(255, 0, 119, 0.6); transform: translateY(-5px); }

        .quantum-action-btn.exams {
            border-color: rgba(0, 242, 254, 0.6);
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.15), rgba(20, 10, 35, 0.9));
        }
        .quantum-action-btn.exams:hover { border-color: #00f2fe; box-shadow: 0 0 35px rgba(0, 242, 254, 0.6); transform: translateY(-5px); }

        .bottom-buttons-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .quantum-action-btn.support {
            border-color: rgba(255, 204, 0, 0.6);
            background: linear-gradient(135deg, rgba(255, 204, 0, 0.15), rgba(20, 10, 35, 0.9));
        }
        .quantum-action-btn.support:hover { border-color: #ffcc00; box-shadow: 0 0 35px rgba(255, 204, 0, 0.6); transform: translateY(-5px); }

        .quantum-action-btn.community {
            border-color: rgba(138, 43, 226, 0.6);
            background: linear-gradient(135deg, rgba(138, 43, 226, 0.15), rgba(20, 10, 35, 0.9));
        }
        .quantum-action-btn.community:hover { border-color: #8a2be2; box-shadow: 0 0 35px rgba(138, 43, 226, 0.6); transform: translateY(-5px); }

        .logout-link {
            display: inline-block;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            transition: color 0.3s;
        }
        .logout-link:hover { color: #ff0077; }

        @media(max-width: 600px) {
            .dashboard-grid, .bottom-buttons-bar { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- زر الثلاث شطات -->
    <div class="menu-toggle-btn" onclick="toggleDrawer()">☰</div>

    <!-- القائمة الجانبية لتعديل الحساب -->
    <div id="sideDrawer" class="side-drawer">
        <div class="drawer-header">
            <h3>⚙️ إعدادات الحساب الشخصي</h3>
            <button class="close-drawer" onclick="toggleDrawer()">✕</button>
        </div>

        <div class="drawer-group">
            <label>تعديل اسم المستخدم</label>
            <input type="text" id="editNameInput" class="drawer-input" placeholder="اكتب الاسم الجديد...">
            <button class="drawer-btn" onclick="updateName()">حفظ الاسم</button>
        </div>

        <div class="drawer-group">
            <label>تغيير كلمة المرور الجديدة</label>
            <input type="password" id="editPassInput" class="drawer-input" placeholder="كلمة المرور الجديدة...">
            <button class="drawer-btn" onclick="updatePassword()">حفظ كلمة المرور</button>
        </div>

        <div class="drawer-group">
            <label>تغيير صورة البروفايل</label>
            <input type="file" id="editImageInput" class="drawer-input" accept="image/*" onchange="updateProfileImage(event)">
        </div>

        <!-- زر الأدمن الخاص بيوسف يظهر هنا حصرياً -->
        <div id="adminPortalBtnContainer" style="display: none; margin-top: 10px;">
            <a href="admin.html" style="background: linear-gradient(135deg, #00a884, #005c4b); color: #fff; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; display: block; text-align: center; box-shadow: 0 0 15px rgba(0,168,132,0.4);">
                👑 لوحة تحكم الأدمن ومراقبة الأبطال
            </a>
        </div>
    </div>

    <div class="elite-glow-badge">⚡ 👑 ⚡ أنت الآن في المكان الصح ⚡ 👑 ⚡</div>

    <div class="quantum-bg-grid">
        <div class="physics-floating-formula" style="left: 6%; font-size: 45px; color: #ff0077; animation-duration: 16s;">E = mc²</div>
        <div class="physics-floating-formula" style="left: 25%; font-size: 50px; color: #ffcc00; animation-duration: 22s;">F = BIL sin($\theta$)</div>
        <div class="physics-floating-formula" style="left: 50%; font-size: 44px; color: #00f2fe; animation-duration: 18s;">V = I × R</div>
        <div class="physics-floating-formula" style="left: 75%; font-size: 48px; color: #ff0077; animation-duration: 24s;">$\oint B \cdot dl$</div>
    </div>

    <div class="platform-quantum-card">
        
        <div class="student-profile-container">
            <div class="student-avatar-frame">
                <img id="studentProfileImg" src="" alt="صورة الطالب الشخصية">
            </div>
            <div class="eng-title-elite">Quantum Portal</div>
            <div id="welcomeStudentDisplay" class="welcome-user-box">أهلاً بك يا بطل</div>
        </div>

        <div class="dashboard-grid">
            <a href="lectures.html" class="quantum-action-btn lectures">
                <span class="icon">🎥</span>
                <span>المحاضرات</span>
            </a>

            <a href="exams.html" class="quantum-action-btn exams">
                <span class="icon">📝</span>
                <span>الامتحانات</span>
            </a>
        </div>

        <div class="bottom-buttons-bar">
            <a href="support.html" class="quantum-action-btn support">
                <span class="icon">🛡️</span>
                <span>الدعم الفني</span>
            </a>

            <a href="community.html" class="quantum-action-btn community">
                <span class="icon">🌐</span>
                <span>جروب الأوائل</span>
            </a>
        </div>

        <a href="index.html" class="logout-link">تسجيل الخروج من الحساب 🔒</a>
    </div>

    <script>
        function toggleDrawer() {
            document.getElementById('sideDrawer').classList.toggle('open');
        }

        // قراءة بيانات الطالب وعرضها
        window.addEventListener('DOMContentLoaded', () => {
            const savedData = localStorage.getItem('activeStudentData');
            if (savedData) {
                const student = JSON.parse(savedData);
                document.getElementById('welcomeStudentDisplay').innerText = `أهلاً بك يا بطل: ${student.name} ⚡`;
                document.getElementById('editNameInput').value = student.name || '';
                
                if (student.userImage) {
                    document.getElementById('studentProfileImg').src = student.userImage;
                }

                // إظهار زر الأدمن ليوسف فقط
                if (student.name && student.name.includes('يوسف')) {
                    document.getElementById('adminPortalBtnContainer').style.display = 'block';
                }
            } else {
                window.location.href = 'index.html';
            }
        });

        // تحديث الاسم
        window.updateName = function() {
            const newName = document.getElementById('editNameInput').value.trim();
            if(!newName) return alert('أدخل الاسم الجديد بشكل صحيح');
            
            let student = JSON.parse(localStorage.getItem('activeStudentData') || '{}');
            student.name = newName;
            localStorage.setItem('activeStudentData', JSON.stringify(student));
            
            document.getElementById('welcomeStudentDisplay').innerText = `أهلاً بك يا بطل: ${student.name} ⚡`;
            alert('✅ تم تغيير الاسم بنجاح!');
            toggleDrawer();
        }

        // تحديث كلمة المرور
        window.updatePassword = function() {
            const newPass = document.getElementById('editPassInput').value.trim();
            if(!newPass) return alert('أدخل كلمة المرور الجديدة');

            let student = JSON.parse(localStorage.getItem('activeStudentData') || '{}');
            student.password = newPass;
            localStorage.setItem('activeStudentData', JSON.stringify(student));
            
            alert('✅ تم تحديث كلمة المرور بنجاح!');
            document.getElementById('editPassInput').value = '';
            toggleDrawer();
        }

        // تحديث صورة البروفايل
        window.updateProfileImage = function(event) {
            const file = event.target.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Image = e.target.result;
                let student = JSON.parse(localStorage.getItem('activeStudentData') || '{}');
                student.userImage = base64Image;
                localStorage.setItem('activeStudentData', JSON.stringify(student));

                document.getElementById('studentProfileImg').src = base64Image;
                alert('✅ تم تحديث صورة البروفايل بنجاح!');
            };
            reader.readAsDataURL(file);
        }
    </script>

</body>
</html>
