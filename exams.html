<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أرشيف الـ 200 امتحان منفصل - فيزياء الثانوية العامة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #030005; color: #fff; min-height: 100vh; overflow-x: hidden; position: relative; padding: 40px 20px; }
        
        .quantum-bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle at 85% 20%, rgba(0, 242, 254, 0.15) 0%, transparent 40%),
                              radial-gradient(circle at 15% 80%, rgba(255, 204, 0, 0.15) 0%, transparent 40%);
            z-index: 0; pointer-events: none;
        }

        .portal-container {
            position: relative; z-index: 10; background: rgba(10, 5, 18, 0.95);
            backdrop-filter: blur(40px); border: 3px solid transparent;
            background-image: linear-gradient(rgba(10, 5, 18, 0.98), rgba(10, 5, 18, 0.98)), linear-gradient(135deg, #00f2fe, #ffcc00, #ff0077);
            background-origin: border-box; background-clip: padding-box, border-box;
            border-radius: 40px; box-shadow: 0 50px 100px rgba(0, 0, 0, 0.95), 0 0 50px rgba(0, 242, 254, 0.2);
            width: 100%; max-width: 1050px; padding: 40px; margin: auto; text-align: center;
        }

        .eng-title-elite {
            font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 900;
            background: linear-gradient(135deg, #00f2fe, #ffcc00);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle { color: #94a3b8; font-size: 15px; margin-bottom: 30px; font-weight: 600; }

        .exams-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px;
            max-height: 480px; overflow-y: auto; padding: 15px; margin-bottom: 30px;
            scrollbar-width: thin; scrollbar-color: #00f2fe rgba(10, 5, 18, 0.8);
        }
        .exams-grid::-webkit-scrollbar { width: 8px; }
        .exams-grid::-webkit-scrollbar-track { background: rgba(10, 5, 18, 0.8); border-radius: 10px; }
        .exams-grid::-webkit-scrollbar-thumb { background: #00f2fe; border-radius: 10px; }

        .exam-btn {
            background: rgba(20, 10, 35, 0.9); border: 2px solid #3b1f4e; border-radius: 12px;
            padding: 14px 8px; color: #fff; font-size: 14px; font-weight: 900;
            cursor: pointer; transition: all 0.3s ease; text-decoration: none;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }
        .exam-btn:hover {
            border-color: #00f2fe; background: rgba(0, 242, 254, 0.1);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4); transform: translateY(-3px); color: #00f2fe;
        }
        .exam-btn.active-ready {
            border-color: #ffcc00; background: linear-gradient(135deg, rgba(255, 204, 0, 0.15), rgba(20, 10, 35, 0.9));
        }

        .back-dashboard-btn {
            display: inline-block; padding: 12px 30px; background: #ff0077; color: #fff;
            border-radius: 14px; text-decoration: none; font-weight: 900; 
            box-shadow: 0 0 20px rgba(255, 0, 119, 0.5); transition: 0.3s;
        }
        .back-dashboard-btn:hover { transform: translateY(-2px); background: #e00068; }
    </style>
</head>
<body>

    <div class="quantum-bg-grid"></div>

    <div class="portal-container">
        <div class="eng-title-elite">⚡ بوابـة الـ 200 امتحـان المستقـل</div>
        <div class="subtitle">كل امتحان مخصص بملف منفصل بذاته لضمان السهولة والمرونة التامة</div>

        <div class="exams-grid" id="examsGridContainer"></div>

        <a href="platform.html" class="back-dashboard-btn">العودة لوحة التحكم الرئيسية ↩</a>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('examsGridContainer');
            let html = '';

            // توليد الـ 200 زر وتوجيه كل زر لملفه المستقل (exam1.html حتى exam200.html)
            for (let i = 1; i <= 200; i++) {
                let targetFile = `exam${i}.html`;
                // امتحان 1 جاهز تماماً، وباقي الامتحانات سيتم إنشاؤها بنفس الطريقة
                let isReady = (i === 1);
                let clickAction = isReady ? `href="${targetFile}"` : `href="${targetFile}" onclick="alert('امتحان رقم (${i}) جاهز بملفه المنفصل!');"`;

                html += `
                    <a href="${targetFile}" class="exam-btn ${isReady ? 'active-ready' : ''}">
                        <span>📝</span>
                        <span>امتحان (${i})</span>
                    </a>
                `;
            }
            container.innerHTML = html;
        });
    </script>

</body>
</html>
