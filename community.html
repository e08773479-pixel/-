<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جروب الأوائل - Quantum WhatsApp Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: #0b141a;
            color: #e9edef;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* حاوية الشات الرئيسية شبيهة بواتساب ويب */
        .wa-chat-container {
            width: 100%;
            max-width: 900px;
            height: 95vh;
            background: #111b21;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #222d34;
        }

        /* هيدر الشات */
        .wa-header {
            background: #202c33;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #222d34;
        }
        .wa-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .wa-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #00a884;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #fff;
        }
        .wa-info h3 {
            font-size: 16px;
            color: #f1f1f1;
            font-weight: 700;
        }
        .wa-info span {
            font-size: 12px;
            color: #8696a0;
        }
        .wa-back {
            color: #8696a0;
            text-decoration: none;
            font-size: 14px;
            font-weight: 650;
        }
        .wa-back:hover { color: #00a884; }

        /* منطقة الرسائل (خلفية واتساب الشهيرة) */
        .wa-messages-area {
            flex: 1;
            background-color: #0b141a;
            background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 0);
            background-size: 20px 20px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* فقاعات الرسائل */
        .wa-msg {
            max-width: 65%;
            padding: 8px 12px;
            border-radius: 8px;
            position: relative;
            font-size: 14.5px;
            line-height: 1.4;
            word-break: break-word;
            box-shadow: 0 1px 0.5px rgba(0,0,0,0.3);
        }
        .wa-msg.incoming {
            background: #202c33;
            align-self: flex-start;
            border-top-left-radius: 0;
            color: #e9edef;
        }
        .wa-msg.outgoing {
            background: #005c4b;
            align-self: flex-end;
            border-top-right-radius: 0;
            color: #e9edef;
        }

        .wa-sender {
            font-size: 11px;
            color: #00a884;
            font-weight: bold;
            margin-bottom: 3px;
        }
        .outgoing .wa-sender { color: #53bdeb; }

        .wa-time {
            font-size: 10px;
            color: #8696a0;
            float: left;
            margin-top: 5px;
            margin-right: 8px;
        }

        /* تذييل الإرسال (واتساب ستايل) */
        .wa-footer {
            background: #202c33;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }
        .wa-icon-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #8696a0;
            transition: 0.2s;
        }
        .wa-icon-btn:hover { color: #e9edef; }

        .wa-input {
            flex: 1;
            background: #2a3942;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            color: #e9edef;
            font-size: 14.5px;
        }
        .wa-input:focus { outline: none; }

        /* حالة التسجيل الصوتي النشط */
        .recording-status {
            display: none;
            color: #ef4444;
            font-weight: bold;
            font-size: 13px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="wa-chat-container">
        <!-- الهيدر -->
        <div class="wa-header">
            <div class="wa-profile">
                <div class="wa-avatar">⚡</div>
                <div class="wa-info">
                    <h3>جروب الأوائل - Quantum Community</h3>
                    <span id="onlineStatus">متصل الآن سحابياً</span>
                </div>
            </div>
            <a href="platform.html" class="wa-back">العودة للوحة التحكم ✕</a>
        </div>

        <!-- صندوق الرسائل -->
        <div id="waMessages" class="wa-messages-area"></div>

        <!-- تذييل الإرسال -->
        <div class="wa-footer">
            <button class="wa-icon-btn" onclick="toggleEmoji()" title="إيموجي">😀</button>
            
            <!-- زر رفع مستند -->
            <label class="wa-icon-btn" title="إرفاق ملف/مستند">
                📎
                <input type="file" id="waFile" style="display:none;" onchange="sendDocument(event)">
            </label>

            <span id="recStatus" class="recording-status">🔴 جاري تسجيل الصوت...</span>

            <input type="text" id="waInput" class="wa-input" placeholder="اكتب رسالة..." onkeypress="if(event.key==='Enter') sendText()">

            <!-- زر المايك للتسجيل الصوتي الفعلي -->
            <button id="micBtn" class="wa-icon-btn" onclick="toggleRecording()" title="تسجيل صوت">🎙️</button>
            
            <!-- زر الإرسال -->
            <button class="wa-icon-btn" onclick="sendText()" style="color: #00a884;" title="إرسال">🚀</button>
        </div>
    </div>

    <!-- جافاسكريبت السحابي المحدث المتكامل -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDPOmjs_GVMhx9qlEURlI90Gb1BDR9hiz8",
          authDomain: "quantumchat-30a44.firebaseapp.com",
          databaseURL: "https://quantumchat-30a44-default-rtdb.firebaseio.com",
          projectId: "quantumchat-30a44",
          storageBucket: "quantumchat-30a44.firebasestorage.app",
          messagingSenderId: "898270556820",
          appId: "1:898270556820:web:0dc8cbf8bd510daab37a81",
          measurementId: "G-S8BF8Z6RT2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, 'whatsapp_style_messages');

        let studentData = {};
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('activeStudentData');
            studentData = saved ? JSON.parse(saved) : { name: "يوسف (الأدمن)" };
        });

        function checkAdmin() {
            return (studentData.name || '').includes('يوسف');
        }

        window.sendText = function() {
            const input = document.getElementById('waInput');
            const text = input.value.trim();
            if(!text) return;

            push(messagesRef, {
                sender: studentData.name || 'طالب',
                text: text,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                isAdmin: checkAdmin()
            });
            input.value = '';
        }

        window.sendDocument = function(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                push(messagesRef, {
                    sender: studentData.name || 'طالب',
                    text: `📁 ملف مرفق: <a href="${e.target.result}" download="${file.name}" style="color:#53bdeb; text-decoration:underline;">${file.name}</a>`,
                    time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                    isAdmin: checkAdmin()
                });
            };
            reader.readAsDataURL(file);
        }

        // تسجيل الصوت الحقيقي من المتصفح
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        window.toggleRecording = async function() {
            const recStatus = document.getElementById('recStatus');
            const micBtn = document.getElementById('micBtn');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        
                        push(messagesRef, {
                            sender: studentData.name || 'طالب',
                            text: `🎤 رسالة صوتية مسجلة:<br><audio controls src="${audioUrl}" style="width:200px; height:35px; margin-top:5px;"></audio>`,
                            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                            isAdmin: checkAdmin()
                        });
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recStatus.style.display = 'inline';
                    micBtn.style.color = '#ef4444';
                } catch (err) {
                    alert('⚠️ عذراً، يرجى السماح للمتصفح بالوصول إلى المايكروفون.');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recStatus.style.display = 'none';
                micBtn.style.color = '#8696a0';
            }
        }

        window.deleteMsg = function(key) {
            remove(ref(db, 'whatsapp_style_messages/' + key));
        }

        // استقبال الرسائل لحظياً
        onValue(messagesRef, (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById('waMessages');
            const isAdmin = checkAdmin();

            if(!data) {
                container.innerHTML = `<div style="text-align:center; color:#8696a0; margin:auto;">لا توجد رسائل بعد... ابدأ الدردشة الآن بتصميم واتساب الاحترافي! ⚡</div>`;
                return;
            }

            let html = '';
            Object.keys(data).forEach(key => {
                const msg = data[key];
                const isMine = msg.sender === (studentData.name || '');
                const deleteBtn = isAdmin ? `<button onclick="deleteMsg('${key}')" style="background:none; border:none; color:#ef4444; font-size:11px; cursor:pointer; float:left; margin-left:10px;">حذف</button>` : '';

                html += `
                    <div class="wa-msg ${isMine ? 'outgoing' : 'incoming'}">
                        <div class="wa-sender">${msg.sender} ${msg.isAdmin ? '👑' : ''}</div>
                        <div>${msg.text}</div>
                        <div style="overflow:hidden;">
                            <span class="wa-time">${msg.time}</span>
                            ${deleteBtn}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        });
    </script>
</body>
</html>
