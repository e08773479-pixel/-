<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جروب الأوائل - Quantum Physics Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: #030005;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .quantum-bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(255, 0, 119, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(0, 242, 254, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 204, 0, 0.1) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        .elite-glow-badge {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, rgba(255, 0, 119, 0.2), rgba(0, 242, 254, 0.2), rgba(255, 204, 0, 0.2));
            border: 2px solid rgba(0, 242, 254, 0.6);
            border-radius: 40px;
            padding: 8px 25px;
            font-size: 14px;
            font-weight: 900;
            color: #00f2fe;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.4);
            z-index: 20;
            text-align: center;
        }

        .platform-quantum-card {
            position: relative;
            z-index: 10;
            background: rgba(10, 5, 18, 0.95);
            backdrop-filter: blur(40px);
            border: 3px solid transparent;
            background-image: linear-gradient(rgba(10, 5, 18, 0.97), rgba(10, 5, 18, 0.97)), 
                              linear-gradient(135deg, #ff0077, #00f2fe, #ffcc00);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            border-radius: 35px;
            box-shadow: 0 70px 140px rgba(0, 0, 0, 0.95);
            width: 92%;
            max-width: 780px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            margin-top: 40px;
        }

        .chat-header {
            padding: 18px 25px;
            border-bottom: 2px solid rgba(59, 31, 78, 0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-title-group h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff0077, #ffcc00, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .online-dot {
            width: 12px;
            height: 12px;
            background: #00ff80;
            border-radius: 50%;
            box-shadow: 0 0 12px #00ff80;
        }

        .back-btn {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
        }
        .back-btn:hover { color: #00f2fe; }

        /* لوحة تحكم طلبات المايك للأدمن */
        .admin-mic-requests-bar {
            background: rgba(255, 0, 119, 0.15);
            border-bottom: 1px solid rgba(255, 0, 119, 0.3);
            padding: 8px 20px;
            display: none;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #ffcc00;
        }
        .accept-mic-btn {
            background: #00ff80;
            color: #030005;
            border: none;
            padding: 4px 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .chat-messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .chat-message-card {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            max-width: 80%;
        }
        .chat-message-card.my-message {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid #00f2fe;
            overflow: hidden;
            background: #020617;
            flex-shrink: 0;
        }
        .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .msg-content-wrapper {
            background: rgba(20, 10, 35, 0.95);
            border: 1px solid #3b1f4e;
            padding: 12px 16px;
            border-radius: 18px;
        }
        .my-message .msg-content-wrapper {
            background: linear-gradient(135deg, rgba(255, 0, 119, 0.2), rgba(20, 10, 35, 0.95));
            border-color: rgba(255, 0, 119, 0.5);
        }

        .msg-sender-name {
            font-size: 12px;
            color: #00f2fe;
            font-weight: 800;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .my-message .msg-sender-name { color: #ffcc00; justify-content: flex-end; }

        .admin-badge-tag {
            background: linear-gradient(135deg, #ff0077, #ffcc00);
            color: #030005;
            font-size: 10px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 6px;
        }

        .msg-text { font-size: 15px; color: #f1f5f9; word-break: break-word; }
        .msg-time { font-size: 10px; color: #94a3b8; margin-top: 4px; }
        .delete-msg-btn { background: none; border: none; color: #ff4d88; font-size: 13px; cursor: pointer; }

        /* تذييل الإرسال والأداوت الاحترافية */
        .chat-input-footer {
            padding: 15px 20px;
            background: rgba(8, 2, 15, 0.9);
            border-top: 2px solid rgba(59, 31, 78, 0.8);
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom-left-radius: 35px;
            border-bottom-right-radius: 35px;
            position: relative;
        }

        .chat-action-btn {
            background: rgba(20, 10, 35, 0.9);
            border: 2px solid #3b1f4e;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            color: #00f2fe;
            transition: 0.3s;
        }
        .chat-action-btn:hover { border-color: #00f2fe; background: rgba(0, 242, 254, 0.15); }

        .chat-text-input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(20, 10, 35, 0.9);
            border: 2px solid #3b1f4e;
            border-radius: 15px;
            color: #fff;
            font-size: 15px;
        }
        .chat-text-input:focus { border-color: #00f2fe; outline: none; }

        .send-msg-btn {
            background: linear-gradient(135deg, #ff0077, #ffcc00);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            color: #030005;
            box-shadow: 0 4px 15px rgba(255, 0, 119, 0.4);
        }
        .send-msg-btn:hover { transform: scale(1.05); }

        /* نافذة اختيار الإيموجي السريعة */
        .emoji-picker-popup {
            position: absolute;
            bottom: 75px;
            left: 20px;
            background: rgba(15, 8, 28, 0.95);
            border: 2px solid #00f2fe;
            border-radius: 15px;
            padding: 10px;
            display: none;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .emoji-picker-popup span {
            font-size: 22px;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }
        .emoji-picker-popup span:hover { transform: scale(1.3); }
    </style>
</head>
<body>

    <div class="elite-glow-badge">⚡ جروب الأوائل - محادثة تفاعلية سحابية متكاملة ⚡</div>
    <div class="quantum-bg-grid"></div>

    <div class="platform-quantum-card">
        <div class="chat-header">
            <div class="chat-title-group">
                <div class="online-dot"></div>
                <h2>Quantum Community Chat</h2>
            </div>
            <a href="platform.html" class="back-btn">← العودة لوحة التحكم</a>
        </div>

        <!-- شريط تنبيهات المايك الجماعي للأدمن -->
        <div id="adminMicBar" class="admin-mic-requests-bar">
            <span id="micRequestText">🎤 طلب كلام صوتي جديد من بطل بالمنصة</span>
            <button class="accept-mic-btn" onclick="approveMicRequest()">الموافقة والتحدث</button>
        </div>

        <div id="chatMessagesContainer" class="chat-messages-container"></div>

        <!-- لوحة الإيموجي -->
        <div id="emojiPopup" class="emoji-picker-popup">
            <span onclick="addEmoji('🔥')">🔥</span>
            <span onclick="addEmoji('⚡')">⚡</span>
            <span onclick="addEmoji('👑')">👑</span>
            <span onclick="addEmoji('🚀')">🚀</span>
            <span onclick="addEmoji('😎')">😎</span>
            <span onclick="addEmoji('💡')">💡</span>
            <span onclick="addEmoji('⭐')">⭐</span>
            <span onclick="addEmoji('🎯')">🎯</span>
            <span onclick="addEmoji('👏')">👏</span>
            <span onclick="addEmoji('💪')">💪</span>
        </div>

        <div class="chat-input-footer">
            <!-- زر إرسال المستندات/الملفات -->
            <label class="chat-action-btn" title="رفع مستند أو ملف">
                📎
                <input type="file" id="fileInput" style="display: none;" onchange="sendFileMessage(event)">
            </label>

            <!-- زر فتح لوحة الإيموجي -->
            <button type="button" class="chat-action-btn" onclick="toggleEmojiPicker()" title="إيموجي">😀</button>

            <!-- زر طلب مايك جماعي -->
            <button type="button" class="chat-action-btn" onclick="requestMicAccess()" title="طلب المايك الجماعي للتحدث">🎙️</button>

            <input type="text" id="chatTextInput" class="chat-text-input" placeholder="اكتب رسالتك أو أرسل مستنداً..." onkeypress="handleKeySend(event)">
            
            <button type="button" class="send-msg-btn" onclick="sendTextMessage()" title="إرسال">🚀</button>
        </div>
    </div>

    <!-- جافاسكريبت السحابي المحدث -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDPOmjs_GVMhx9qlEURlI90Gb1BDR9hiz8",
          authDomain: "quantumchat-30a44.firebaseapp.com",
          databaseURL: "https://quantumchat-30a44-default-rtdb.firebaseio.com",
          projectId: "quantumchat-30a44",
          storageBucket: "quantumchat-30a44.firebasestorage.app",
          messagingSenderId: "898270556820",
          appId: "1:898270556820:web:0dc8cbf8bd510daab37a81",
          measurementId: "G-S8BF8Z6RT2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, 'community_messages');
        const micRequestsRef = ref(db, 'mic_requests');

        let currentStudent = {};
        
        window.addEventListener('DOMContentLoaded', () => {
            const savedData = localStorage.getItem('activeStudentData');
            if (savedData) {
                currentStudent = JSON.parse(savedData);
            } else {
                currentStudent = { name: "يوسف (الأدمن)", userImage: "https://via.placeholder.com/150" };
            }

            // الاستماع لطلبات المايك لو المستخدم أدمن
            if (checkIsAdmin()) {
                onValue(micRequestsRef, (snapshot) => {
                    const reqData = snapshot.val();
                    const micBar = document.getElementById('adminMicBar');
                    const reqText = document.getElementById('micRequestText');
                    if (reqData && reqData.studentName) {
                        reqText.innerText = `🎤 طلب كلام صوتي من البطل: ${reqData.studentName}`;
                        micBar.style.display = 'flex';
                    } else {
                        micBar.style.display = 'none';
                    }
                });
            }
        });

        function checkIsAdmin() {
            const name = (currentStudent.name || '').trim();
            return name.includes('يوسف') || name.includes('Youssef');
        }

        // إرسال رسالة نصية
        window.sendTextMessage = function() {
            const inputField = document.getElementById('chatTextInput');
            const text = inputField.value.trim();
            if (!text) return;

            const isAdmin = checkIsAdmin();
            const newMessageRef = push(messagesRef);
            set(newMessageRef, {
                name: currentStudent.name || 'طالب متميز',
                userImage: currentStudent.userImage || 'https://via.placeholder.com/150',
                text: text,
                type: 'text',
                isAdmin: isAdmin,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });

            inputField.value = '';
        }

        window.handleKeySend = function(event) {
            if (event.key === 'Enter') sendTextMessage();
        }

        // إرسال مستند أو ملف
        window.sendFileMessage = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const fileDataUrl = e.target.result;
                const isAdmin = checkIsAdmin();
                const newMessageRef = push(messagesRef);
                
                set(newMessageRef, {
                    name: currentStudent.name || 'طالب متميز',
                    userImage: currentStudent.userImage || 'https://via.placeholder.com/150',
                    text: `📎 مستند مرفق: <a href="${fileDataUrl}" download="${file.name}" style="color: #00f2fe; text-decoration: underline;">${file.name}</a>`,
                    type: 'file',
                    isAdmin: isAdmin,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });
            };
            reader.readAsDataURL(file);
        }

        // إيموجي
        window.toggleEmojiPicker = function() {
            const popup = document.getElementById('emojiPopup');
            popup.style.display = popup.style.display === 'grid' ? 'none' : 'grid';
        }

        window.addEmoji = function(emoji) {
            const inputField = document.getElementById('chatTextInput');
            inputField.value += emoji;
            document.getElementById('emojiPopup').style.display = 'none';
        }

        // نظام طلبات المايك الجماعي
        window.requestMicAccess = function() {
            set(micRequestsRef, {
                studentName: currentStudent.name || 'طالب متميز',
                timestamp: Date.now()
            });
            alert('🚀 تم إرسال طلب التحدث الصوتي إلى الأدمن بنجاح! انتظر الموافقة.');
        }

        window.approveMicRequest = function() {
            alert('🎙️ تم الموافقة على المايك! يمكنك التحدث الآن لجميع الأبطال.');
            remove(micRequestsRef);
            document.getElementById('adminMicBar').style.display = 'none';
        }

        window.deleteCloudMessage = function(msgKey) {
            remove(ref(db, 'community_messages/' + msgKey));
        }

        // عرض واستقبال الرسائل سحابياً
        onValue(messagesRef, (snapshot) => {
            const data = snapshot.val();
            const container = document.getElementById('chatMessagesContainer');
            const isAdminLoggedIn = checkIsAdmin();

            let htmlContent = '';
            if (!data) {
                container.innerHTML = `<div style="text-align: center; color: #94a3b8; margin: auto; font-weight: 700;">لا توجد رسائل بعد... ابدأ المحادثة وشارك الملفات والإيموجي يا بطل! ⚡</div>`;
                return;
            }

            Object.keys(data).forEach((key) => {
                const msg = data[key];
                const isMine = msg.name === (currentStudent.name || '');
                const avatarSrc = msg.userImage || 'https://via.placeholder.com/150';
                const adminBadge = msg.isAdmin ? `<span class="admin-badge-tag">👑 الأدمن</span>` : '';
                const deleteBtnHtml = isAdminLoggedIn ? `<button class="delete-msg-btn" onclick="deleteCloudMessage('${key}')">🗑️ حذف</button>` : '';
                
                htmlContent += `
                    <div class="chat-message-card ${isMine ? 'my-message' : ''}">
                        <div class="msg-avatar"><img src="${avatarSrc}" alt="${msg.name}"></div>
                        <div class="msg-content-wrapper">
                            <div class="msg-sender-name"><span>${msg.name}</span>${adminBadge}</div>
                            <div class="msg-text">${msg.text}</div>
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
                                <span class="msg-time">${msg.time}</span>
                                ${deleteBtnHtml}
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = htmlContent;
            container.scrollTop = container.scrollHeight;
        });
    </script>
</body>
</html>
