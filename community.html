<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جروب الأوائل - Quantum Physics Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: #030005;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .quantum-bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(255, 0, 119, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(0, 242, 254, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 204, 0, 0.1) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        .physics-floating-formula {
            position: absolute;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            opacity: 0.18;
            animation: quantumFloat 20s infinite linear;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes quantumFloat {
            0% { transform: translateY(115vh) translateX(-50px) rotate(0deg) scale(0.9); }
            50% { transform: translateY(50vh) translateX(50px) rotate(180deg) scale(1.1); }
            100% { transform: translateY(-150px) translateX(-30px) rotate(360deg) scale(0.9); }
        }

        .elite-glow-badge {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, rgba(255, 0, 119, 0.2), rgba(0, 242, 254, 0.2), rgba(255, 204, 0, 0.2));
            border: 2px solid rgba(0, 242, 254, 0.6);
            border-radius: 40px;
            padding: 8px 25px;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #00f2fe;
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.4), inset 0 0 15px rgba(255, 0, 119, 0.3);
            z-index: 20;
            text-align: center;
        }

        .platform-quantum-card {
            position: relative;
            z-index: 10;
            background: rgba(10, 5, 18, 0.95);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 3px solid transparent;
            background-image: linear-gradient(rgba(10, 5, 18, 0.97), rgba(10, 5, 18, 0.97)), 
                              linear-gradient(135deg, #ff0077, #00f2fe, #ffcc00);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            border-radius: 35px;
            box-shadow: 0 70px 140px rgba(0, 0, 0, 0.95), 
                        0 0 60px rgba(255, 0, 119, 0.3), 
                        0 0 60px rgba(0, 242, 254, 0.3);
            width: 92%;
            max-width: 750px;
            height: 82vh;
            display: flex;
            flex-direction: column;
            margin-top: 40px;
        }

        .chat-header {
            padding: 18px 25px;
            border-bottom: 2px solid rgba(59, 31, 78, 0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-title-group h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff0077, #ffcc00, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .online-dot {
            width: 12px;
            height: 12px;
            background: #00ff80;
            border-radius: 50%;
            box-shadow: 0 0 12px #00ff80;
            animation: pulseGlow 1.5s infinite;
        }
        @keyframes pulseGlow {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .back-btn {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: 0.3s;
        }
        .back-btn:hover {
            color: #00f2fe;
        }

        .chat-messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .chat-message-card {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            max-width: 80%;
            animation: fadeInMsg 0.3s ease;
            position: relative;
        }
        @keyframes fadeInMsg {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-message-card.my-message {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid #00f2fe;
            overflow: hidden;
            background: #020617;
            flex-shrink: 0;
        }
        .msg-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%;
        }

        .msg-content-wrapper {
            background: rgba(20, 10, 35, 0.95);
            border: 1px solid #3b1f4e;
            padding: 12px 16px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }
        .my-message .msg-content-wrapper {
            background: linear-gradient(135deg, rgba(255, 0, 119, 0.2), rgba(20, 10, 35, 0.95));
            border-color: rgba(255, 0, 119, 0.5);
        }

        .msg-sender-name {
            font-size: 12px;
            color: #00f2fe;
            font-weight: 800;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .my-message .msg-sender-name {
            color: #ffcc00;
            justify-content: flex-end;
        }

        /* شارة الأدمن المميزة لك يا بشمهندس يوسف */
        .admin-badge-tag {
            background: linear-gradient(135deg, #ff0077, #ffcc00);
            color: #030005;
            font-size: 10px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(255, 0, 119, 0.6);
        }

        .msg-text {
            font-size: 15px;
            color: #f1f5f9;
            word-break: break-word;
            line-height: 1.5;
        }
        .msg-time {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 4px;
            text-align: left;
        }

        /* زر حذف رسالة خاص بالصلاحيات (للأدمن) */
        .delete-msg-btn {
            background: none;
            border: none;
            color: #ff4d88;
            font-size: 13px;
            cursor: pointer;
            padding: 2px 6px;
            opacity: 0.7;
            transition: 0.2s;
        }
        .delete-msg-btn:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .chat-input-footer {
            padding: 15px 20px;
            background: rgba(8, 2, 15, 0.9);
            border-top: 2px solid rgba(59, 31, 78, 0.8);
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom-left-radius: 35px;
            border-bottom-right-radius: 35px;
        }

        .chat-text-input {
            flex: 1;
            padding: 14px 18px;
            background: rgba(20, 10, 35, 0.9);
            border: 2px solid #3b1f4e;
            border-radius: 15px;
            color: #fff;
            font-size: 15px;
            transition: 0.3s;
        }
        .chat-text-input:focus {
            border-color: #00f2fe;
            outline: none;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }

        .chat-action-icon-btn {
            background: rgba(20, 10, 35, 0.9);
            border: 2px solid #3b1f4e;
            width: 48px;
            height: 48px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: 0.3s;
            color: #00f2fe;
        }
        .chat-action-icon-btn:hover {
            border-color: #00f2fe;
            background: rgba(0, 242, 254, 0.15);
            transform: scale(1.05);
        }
        .chat-action-icon-btn.mic-btn.recording {
            border-color: #ff0055;
            background: rgba(255, 0, 85, 0.3);
            color: #ff4d88;
            animation: pulseGlow 1s infinite;
        }

        .send-msg-btn {
            background: linear-gradient(135deg, #ff0077, #ffcc00);
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            color: #030005;
            transition: 0.3s;
            box-shadow: 0 5px 20px rgba(255, 0, 119, 0.4);
        }
        .send-msg-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 204, 0, 0.7);
        }
    </style>
</head>
<body>

    <div class="elite-glow-badge">⚡ 👑 ⚡ جروب الأوائل - تفاعل حر 24 ساعة ⚡ 👑 ⚡</div>

    <div class="quantum-bg-grid">
        <div class="physics-floating-formula" style="left: 6%; font-size: 45px; color: #ff0077; animation-duration: 16s;">E = mc²</div>
        <div class="physics-floating-formula" style="left: 25%; font-size: 50px; color: #ffcc00; animation-duration: 22s;">F = BIL sin($\theta$)</div>
        <div class="physics-floating-formula" style="left: 50%; font-size: 44px; color: #00f2fe; animation-duration: 18s;">V = I × R</div>
        <div class="physics-floating-formula" style="left: 75%; font-size: 48px; color: #ff0077; animation-duration: 24s;">$\oint B \cdot dl$</div>
    </div>

    <div class="platform-quantum-card">
        
        <div class="chat-header">
            <div class="chat-title-group">
                <div class="online-dot"></div>
                <h2>Quantum Community Chat</h2>
            </div>
            <a href="platform.html" class="back-btn">← العودة للوحة التحكم</a>
        </div>

        <div id="chatMessagesContainer" class="chat-messages-container"></div>

        <div class="chat-input-footer">
            <button type="button" id="micRecordBtn" class="chat-action-icon-btn mic-btn" title="تسجيل صوتي" onclick="toggleAudioRecording()">🎙️</button>
            <input type="text" id="chatTextInput" class="chat-text-input" placeholder="اكتب رسالتك لجميع الأبطال..." onkeypress="handleKeySend(event)">
            <button type="button" class="send-msg-btn" onclick="sendTextMessage()" title="إرسال">🚀</button>
        </div>

    </div>

    <script>
        let currentStudent = {};
        
        window.addEventListener('DOMContentLoaded', () => {
            const savedData = localStorage.getItem('activeStudentData');
            if (savedData) {
                currentStudent = JSON.parse(savedData);
            } else {
                // إذا لم يتم تسجيل الدخول، يوجهه للرئيسية لأمان المنصة
                window.location.href = 'index.html';
                return;
            }
            loadCommunityMessages();
            // تحديث لحظي مستمر 24 ساعة لجميع المتصلين في نفس اللحظة
            setInterval(loadCommunityMessages, 1000);
        });

        // التحقق مما إذا كان المستخدم الحالي هو مهندس المنصة (الأدمن: يوسف اشرف)
        function checkIsAdmin() {
            const name = (currentStudent.name || '').trim();
            return name.includes('يوسف') || name.includes('Youssef');
        }

        function sanitizeInput(input) {
            if (!input) return '';
            const element = document.createElement('div');
            element.innerText = input;
            return element.innerHTML;
        }

        function sendTextMessage() {
            const inputField = document.getElementById('chatTextInput');
            const text = inputField.value.trim();
            if (!text) return;

            const isAdmin = checkIsAdmin();
            const newMessage = {
                id: Date.now() + Math.random(),
                name: currentStudent.name || 'طالب متميز',
                userImage: currentStudent.userImage || '',
                text: sanitizeInput(text),
                type: 'text',
                isAdmin: isAdmin,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            saveAndBroadcastMessage(newMessage);
            inputField.value = '';
        }

        function handleKeySend(event) {
            if (event.key === 'Enter') {
                sendTextMessage();
            }
        }

        let isRecording = false;
        function toggleAudioRecording() {
            const micBtn = document.getElementById('micRecordBtn');
            if (!isRecording) {
                isRecording = true;
                micBtn.classList.add('recording');
                micBtn.title = "جاري التسجيل... اضغط للإيقاف والإرسال";
            } else {
                isRecording = false;
                micBtn.classList.remove('recording');
                micBtn.title = "تسجيل صوتي";
                
                const isAdmin = checkIsAdmin();
                const audioMessage = {
                    id: Date.now() + Math.random(),
                    name: currentStudent.name || 'طالب متميز',
                    userImage: currentStudent.userImage || '',
                    text: '🎤 [رسالة صوتية مباشرة من البطل]',
                    type: 'audio',
                    isAdmin: isAdmin,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };
                saveAndBroadcastMessage(audioMessage);
            }
        }

        function saveAndBroadcastMessage(msg) {
            let messages = JSON.parse(localStorage.getItem('quantumCommunityMessages') || '[]');
            messages.push(msg);
            if (messages.length > 100) {
                messages = messages.slice(messages.length - 100);
            }
            localStorage.setItem('quantumCommunityMessages', JSON.stringify(messages));
            loadCommunityMessages();
        }

        // صلاحيات الأدمن: حذف أي رسالة مخالفة للتحكم الكامل
        function deleteMessage(msgId) {
            if (!checkIsAdmin()) return;
            let messages = JSON.parse(localStorage.getItem('quantumCommunityMessages') || '[]');
            messages = messages.filter(m => m.id !== msgId);
            localStorage.setItem('quantumCommunityMessages', JSON.stringify(messages));
            loadCommunityMessages();
        }

        function loadCommunityMessages() {
            const container = document.getElementById('chatMessagesContainer');
            const messages = JSON.parse(localStorage.getItem('quantumCommunityMessages') || '[]');
            const isAdminLoggedIn = checkIsAdmin();
            
            const isScrolledToBottom = container.scrollHeight - container.clientHeight <= container.scrollTop + 50;

            let htmlContent = '';
            if (messages.length === 0) {
                htmlContent = `<div style="text-align: center; color: #94a3b8; margin-top: auto; margin-bottom: auto; font-weight: 700;">لا توجد رسائل بعد... كن أول من يبدأ المحادثة ونشر التفاعل يا بطل! ⚡</div>`;
            } else {
                messages.forEach(msg => {
                    const isMine = msg.name === (currentStudent.name || '');
                    const avatarSrc = msg.userImage || 'https://via.placeholder.com/150';
                    const adminBadge = msg.isAdmin ? `<span class="admin-badge-tag">👑 الأدمن المبرمج</span>` : '';
                    const deleteBtnHtml = isAdminLoggedIn ? `<button class="delete-msg-btn" onclick="deleteMessage(${msg.id})" title="حذف الرسالة (صلاحية أدمن)">🗑️ حذف</button>` : '';
                    
                    htmlContent += `
                        <div class="chat-message-card ${isMine ? 'my-message' : ''}">
                            <div class="msg-avatar">
                                <img src="${avatarSrc}" alt="${msg.name}">
                            </div>
                            <div class="msg-content-wrapper">
                                <div class="msg-sender-name">
                                    <span>${msg.name}</span>
                                    ${adminBadge}
                                </div>
                                <div class="msg-text">${msg.text}</div>
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
                                    <span class="msg-time">${msg.time}</span>
                                    ${deleteBtnHtml}
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            container.innerHTML = htmlContent;

            if (isScrolledToBottom || messages.length <= 5) {
                container.scrollTop = container.scrollHeight;
            }
        }
    </script>

</body>
</html>
